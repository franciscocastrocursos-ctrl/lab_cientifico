};

exp.onParam = function (k) {
  const visualOnly = ['speed', 'frame', 'view', 'trails', 'showCM', 'showV', 'showF', 'labels', 'kepler', 'duration'];
  if (visualOnly.includes(k)) { exp.draw(); exp.updateReadouts(); exp.autosave(); return; }
  exp.reset(); exp.autosave();
};
exp.autosave = () => LAB.store.set('last.binary', exp.serialize());
exp.loadScenario = function (k) {
  const s = scenarios[k]; if (!s) return;
  const vals = Object.assign(exp.panel.defaults(), s.p);
  exp.panel.setValues(vals);
  exp.scenario = k; if (exp._scenarioSel) { exp._scenarioSel.value = k; exp._scenarioDesc(); }
  exp.log.add('escenario', 'Escenario cargado: ' + s.name);
  exp.reset(); exp.autosave();
};
exp.serialize = () => ({ experimento: 'binary', version: LAB.version, escenario: exp.scenario || null, params: Object.assign({}, exp.panel.values), fecha: U.nowStamp() });
exp.deserialize = function (o) { exp.panel.setValues(o.params || {}); exp.scenario = o.escenario; if (exp._scenarioSel && o.escenario) { exp._scenarioSel.value = o.escenario; exp._scenarioDesc(); } exp.reset(); };

exp.reset = function () {
  const p = exp.p = Object.assign({}, exp.panel.values);
  exp.s = M.initState(p);
  exp.dt = M.chooseDt(p);
  exp.d0 = M.diag(exp.s);
  exp.el0 = M.elements(p.m1, p.m2, exp.d0.dx, exp.d0.dy, exp.d0.dvx, exp.d0.dvy);
  exp.series = { t: [], r: [], rk: [], K: [], U: [], E: [], dE: [], dL: [], dk: [], cmx: [], cmy: [], dcm: [] };
  exp.trail1 = []; exp.trail2 = []; exp.trailCM = [];
  exp.theta0 = Math.atan2(exp.d0.dy, exp.d0.dx); exp.thetaPrev = exp.theta0; exp.thetaAcc = 0; exp.Pmeas = null;
  exp.maxDev = { dE: 0, dL: 0, dk: 0, dcm: 0 };
  exp.running = false; exp.playBtn.textContent = 'Iniciar'; exp.done = false;
  exp.Eref = Math.abs(exp.d0.E) > 1e-3 * (Math.abs(exp.d0.K) + Math.abs(exp.d0.U)) ? Math.abs(exp.d0.E) : Math.abs(exp.d0.K) + Math.abs(exp.d0.U);
  exp.ErefNote = Math.abs(exp.d0.E) > 1e-3 * (Math.abs(exp.d0.K) + Math.abs(exp.d0.U)) ? '|E₀|' : 'K₀+|U₀| (E₀≈0)';
  exp.sampleEvery = Math.max(1, Math.round((p.duration / 1500) / exp.dt));
  exp.sample();
  exp.autoView(true);
  exp.updateReadouts(); exp.draw(); exp.drawCharts(true);
};
exp.autoView = function (silent) {
  const el0 = exp.el0, p = exp.p;
  let ext = el0.bound ? el0.ra : Math.max(p.r0 * 6, 4 * p.r0);
  if (p.frame === 'inertial' && p.vcm > 0) ext = Math.max(ext, p.vcm / M.KMS_PER_AUYR * p.duration * 1.1);
  const v = U.clamp(ext * 1.25, 0.1, 400);
  if (silent && exp._viewInit) return;
  exp._viewInit = true;
  exp.panel.setValues({ view: +v.toPrecision(3) });
  exp.draw();
};
exp.sample = function () {
  const s = exp.s, d = M.diag(s), S = exp.series;
  // ángulo acumulado del vector relativo → periodo medido
  const th = Math.atan2(d.dy, d.dx);
  let dth = th - exp.thetaPrev; if (dth > Math.PI) dth -= 2 * Math.PI; if (dth < -Math.PI) dth += 2 * Math.PI;
  const prevAcc = exp.thetaAcc; exp.thetaAcc += dth; exp.thetaPrev = th;
  if (exp.Pmeas === null && Math.abs(exp.thetaAcc) >= 2 * Math.PI && S.t.length) {
    const tPrev = S.t[S.t.length - 1];
    const f = (2 * Math.PI - Math.abs(prevAcc)) / (Math.abs(exp.thetaAcc) - Math.abs(prevAcc));
    exp.Pmeas = tPrev + f * (s.t - tPrev);
    exp.log.add('medida', 'Primera vuelta completa: periodo medido ' + U.fmt(exp.Pmeas, 6) + ' años');
  }
  const kp = M.keplerAt(exp.el0, s.t);
  const scale = exp.el0.bound ? exp.el0.a : exp.p.r0;
  const dk = kp ? Math.hypot(d.dx - kp.x, d.dy - kp.y) / scale : NaN;
  const dE = (d.E - exp.d0.E) / exp.Eref;
  const dL = Math.abs(exp.d0.L) > 0 ? (d.L - exp.d0.L) / Math.abs(exp.d0.L) : NaN;
  const dcm = Math.hypot(d.Rx - (exp.s.R0x + exp.s.Vx * s.t), d.Ry - (exp.s.R0y + exp.s.Vy * s.t));
  S.t.push(s.t); S.r.push(d.r); S.rk.push(kp ? kp.r : NaN); S.K.push(d.K); S.U.push(d.U); S.E.push(d.E);
  S.dE.push(dE); S.dL.push(dL); S.dk.push(dk); S.cmx.push(d.Rx); S.cmy.push(d.Ry); S.dcm.push(dcm);
  const m = exp.maxDev; m.dE = Math.max(m.dE, Math.abs(dE)); if (Number.isFinite(dL)) m.dL = Math.max(m.dL, Math.abs(dL)); if (Number.isFinite(dk)) m.dk = Math.max(m.dk, dk); m.dcm = Math.max(m.dcm, dcm);
  exp.trail1.push(s.x1, s.y1); exp.trail2.push(s.x2, s.y2); exp.trailCM.push(d.Rx, d.Ry);
  exp.cur = d;
};
exp.toggle = function () {
  if (exp.done) exp.reset();
  exp.running = !exp.running;
  exp.playBtn.textContent = exp.running ? 'Pausa' : 'Continuar';
  exp.log.add('reproducción', exp.running ? 'Simulación en marcha' : 'Simulación en pausa (t = ' + U.fmt(exp.s.t) + ' años)');
};
exp.stepFrames = function (n) { for (let i = 0; i < n; i++) { if (exp.s.t >= exp.p.duration) break; M.step(exp.s, exp.dt); if (exp.s.steps % exp.sampleEvery === 0) exp.sample(); } exp.cur = M.diag(exp.s); exp.updateReadouts(); exp.draw(); exp.drawCharts(); };
exp.tick = function (dtReal) {
  if (!exp.running) return;
  const p = exp.p;
  const target = Math.min(p.duration, exp.s.t + exp.panel.values.speed * dtReal);
  const t0 = performance.now();
  while (exp.s.t + exp.dt <= target + 1e-12) {
    M.step(exp.s, exp.dt);
    if (exp.s.steps % exp.sampleEvery === 0) exp.sample();
    if (performance.now() - t0 > 18) { exp.behind = true; break; }
  }
  if (performance.now() - t0 <= 18) exp.behind = false;
  if (exp.s.t + exp.dt > p.duration + 1e-12) {
    exp.running = false; exp.done = true; exp.playBtn.textContent = 'Reiniciar y empezar';
    exp.sample(); exp.log.add('fin', 'Duración alcanzada: t = ' + U.fmt(exp.s.t, 6) + ' años (' + exp.s.steps + ' pasos)');
  }
  exp.cur = M.diag(exp.s);
  exp.updateReadouts(); exp.draw();
  exp._chartT = (exp._chartT || 0) + dtReal;
  if (exp._chartT > 0.25 || exp.done) { exp._chartT = 0; exp.drawCharts(); }
};

exp.updateReadouts = function () {
  const p = exp.p, d = exp.cur || M.diag(exp.s), e0 = exp.el0, go = exp.gOut, gi = exp.gIn, gv = exp.gVal;
  const Mt = p.m1 + p.m2;
  gi.set('M', U.fmt(Mt)); gi.set('q', U.fmt(p.m2 / p.m1)); gi.set('v0', U.fmt(p.vrel)); gi.set('vc', U.fmt(M.vCircKms(p.m1, p.m2, p.r0))); gi.set('dt', U.fmt(exp.dt, 3));
  const elc = M.elements(p.m1, p.m2, d.dx, d.dy, d.dvx, d.dvy);
  go.set('t', U.fmt(exp.s.t, 5)); go.set('r', U.fmt(d.r, 5));
  const type = !e0.bound ? (Math.abs(e0.e - 1) < 1e-6 ? 'parabólica (límite)' : 'no ligada (hipérbola)') : e0.e < 1e-3 ? 'ligada, circular' : 'ligada, elíptica';
  go.set('type', type); go.set('e', U.fmt(elc.e, 4)); go.set('a', e0.bound ? U.fmt(elc.a, 5) : '— (E>0)');
  go.set('P', e0.bound ? U.fmt(e0.P, 6) : 'no periódica'); go.set('Pm', exp.Pmeas ? U.fmt(exp.Pmeas, 6) : e0.bound ? 'aún sin vuelta completa' : 'no aplica');
  go.set('rp', U.fmt(e0.rp, 4) + ' / ' + (e0.bound ? U.fmt(e0.ra, 4) : '∞'));
  go.set('d12', U.fmt(p.m2 / Mt * d.r, 4) + ' ; ' + U.fmt(p.m1 / Mt * d.r, 4));
  go.set('K', U.fmt(d.K, 5)); go.set('Up', U.fmt(d.U, 5)); go.set('E', U.fmt(d.E, 6)); go.set('L', U.fmt(d.L, 6)); go.set('cm', '(' + U.fmt(d.Rx, 3) + ', ' + U.fmt(d.Ry, 3) + ')');
  const S = exp.series, n = S.t.length - 1;
  gv.set('dE', U.fmt(Math.abs(S.dE[n]), 3)); gv.set('dEm', U.fmt(exp.maxDev.dE, 3));
  gv.set('dL', U.fmt(Math.abs(S.dL[n]), 3)); gv.set('dcm', U.fmt(S.dcm[n], 3)); gv.set('dk', Number.isFinite(S.dk[n]) ? U.fmt(S.dk[n], 3) : 'no aplica');
  const msgs = [];
  const mE = exp.maxDev.dE;
  msgs.push(mE < 1e-5 ? ['ok', `Energía conservada dentro de 10⁻⁵ (referencia ${exp.ErefNote}).`] : mE < 1e-3 ? ['warn', `Error de energía ${U.fmt(mE, 2)}: aceptable para visualizar; aumente los pasos por periastro para mayor precisión.`] : ['bad', `Error de energía ${U.fmt(mE, 2)} > 10⁻³: el paso dt es demasiado grande para esta órbita. Aumente «Pasos por periodo de periastro».`]);
  if (!e0.bound) msgs.push(['info', 'Energía interna positiva: el par no está ligado y la separación crece sin límite.']);
  if (e0.bound && e0.rp < 0.01) msgs.push(['warn', 'Periastro < 0,01 UA: en una binaria real las estrellas podrían tocarse; el modelo de masas puntuales no lo representa.']);
  if (exp.behind) msgs.push(['info', 'El cálculo no alcanza la velocidad de reproducción pedida; la animación va más lenta, pero dt no se ha modificado.']);
  if (p.vcm > 0 && p.frame === 'cm') msgs.push(['info', 'Vista en el sistema del CM: el desplazamiento del conjunto no se ve. Cambie a «Inercial» para verlo.']);
  LAB.setMsgs(exp.msgs, msgs);
  exp.clock.textContent = `t = ${U.fmt(exp.s.t, 4)} / ${U.fmt(p.duration, 3)} años · ${exp.s.steps} pasos · dt = ${U.fmt(exp.dt, 3)} años`;
};

exp.draw = function () {
  const cv = exp.canvas; if (!cv.isConnected || cv.clientWidth === 0 || !exp.s) return;
  const { ctx, w, h } = LAB.fitCanvas(cv), T = LAB.theme(), p = exp.panel.values, s = exp.s, d = exp.cur || M.diag(s);
  ctx.fillStyle = T['scene-bg']; ctx.fillRect(0, 0, w, h);
  const scale = Math.min(w, h) / p.view; // px por UA
  const inertial = p.frame === 'inertial';
  const ox = inertial ? 0 : d.Rx, oy = inertial ? 0 : d.Ry;
  // en vista inercial con deriva, centrar en la mitad del recorrido previsto
  let cx = 0, cy = 0;
  if (inertial && exp.p.vcm > 0) { cx = s.Vx * exp.p.duration / 2; cy = s.Vy * exp.p.duration / 2; }
  const X = x => w / 2 + (x - ox - cx) * scale, Y = y => h / 2 - (y - oy - cy) * scale;
  // rejilla en UA
  const stepAU = Math.pow(10, Math.floor(Math.log10(p.view / 4)));
  ctx.strokeStyle = T.line; ctx.globalAlpha = .45; ctx.lineWidth = 1;
  const x0 = ox + cx - w / 2 / scale, x1 = ox + cx + w / 2 / scale, y0 = oy + cy - h / 2 / scale, y1 = oy + cy + h / 2 / scale;
  for (let gx = Math.ceil(x0 / stepAU) * stepAU; gx <= x1; gx += stepAU) { ctx.beginPath(); ctx.moveTo(X(gx), 0); ctx.lineTo(X(gx), h); ctx.stroke(); }
  for (let gy = Math.ceil(y0 / stepAU) * stepAU; gy <= y1; gy += stepAU) { ctx.beginPath(); ctx.moveTo(0, Y(gy)); ctx.lineTo(w, Y(gy)); ctx.stroke(); }
  ctx.globalAlpha = 1;
  // órbitas analíticas de Kepler (en el sistema del CM, trasladadas)
  if (p.kepler && (exp.el0.bound || exp.el0.e > 1)) {
    const e0 = exp.el0, Mt = s.m1 + s.m2;
    const tmax = e0.bound ? e0.P : exp.p.duration;
    ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    for (const [col, f] of [[T['star-a'], -s.m2 / Mt], [T['star-b'], s.m1 / Mt]]) {
      ctx.strokeStyle = col; ctx.globalAlpha = .6; ctx.beginPath();
      for (let i = 0; i <= 400; i++) {
        const k = M.keplerAt(e0, tmax * i / 400); if (!k) break;
        const Rx = inertial ? s.Vx * (tmax * i / 400) * 0 + d.Rx : d.Rx, Ry = d.Ry;
        const px = X(Rx + f * k.x), py = Y(Ry + f * k.y);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  // trayectorias (estrella 1 continua, estrella 2 discontinua: no solo color)
  if (p.trails) {
    const drawTrail = (arr, col, dash) => {
      ctx.strokeStyle = col; ctx.lineWidth = 1.4; ctx.setLineDash(dash); ctx.globalAlpha = .75; ctx.beginPath();
      for (let i = 0; i < arr.length; i += 2) { const px = X(arr[i]), py = Y(arr[i + 1]); if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
      ctx.lineTo(X(arr === exp.trail1 ? s.x1 : arr === exp.trail2 ? s.x2 : d.Rx), Y(arr === exp.trail1 ? s.y1 : arr === exp.trail2 ? s.y2 : d.Ry));
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
    };
    drawTrail(exp.trail1, T['star-a'], []); drawTrail(exp.trail2, T['star-b'], [6, 4]);
    if (inertial && p.showCM) drawTrail(exp.trailCM, T['ink-3'], [2, 3]);
  }
  // centro de masa
  if (p.showCM) {
    const px = X(d.Rx), py = Y(d.Ry);
    ctx.strokeStyle = T.ink; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px - 7, py); ctx.lineTo(px + 7, py); ctx.moveTo(px, py - 7); ctx.lineTo(px, py + 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.stroke();
    if (p.labels) { ctx.fillStyle = T['ink-2']; ctx.font = `11px ${T.mono}`; ctx.fillText('CM', px + 8, py - 8); }
  }
  // flechas
  const arrow = (x, y, dx, dy, col, label) => {
    const L = Math.hypot(dx, dy); if (L < 2) return;
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + dx, y + dy); ctx.stroke();
    const a = Math.atan2(dy, dx);
    ctx.beginPath(); ctx.moveTo(x + dx, y + dy); ctx.lineTo(x + dx - 8 * Math.cos(a - .4), y + dy - 8 * Math.sin(a - .4)); ctx.lineTo(x + dx - 8 * Math.cos(a + .4), y + dy - 8 * Math.sin(a + .4)); ctx.closePath(); ctx.fill();
    if (label && p.labels) { ctx.font = `10px ${T.mono}`; ctx.fillText(label, x + dx + 4, y + dy - 4); }
  };
  const vmax = Math.max(Math.hypot(s.vx1, s.vy1), Math.hypot(s.vx2, s.vy2), 1e-9);
  const vs = 0.18 * Math.min(w, h) / vmax; // px por UA/año (escala visual)
  const a = M.accel(s), Fm = M.G * s.m1 * s.m2 / (a.r * a.r);
  const fs = 0.12 * Math.min(w, h) / Fm;
  const r1 = 4 + 5 * Math.cbrt(s.m1), r2 = 4 + 5 * Math.cbrt(s.m2);
  // estrellas
  const star = (x, y, r, col, name) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2.4);
    g.addColorStop(0, col); g.addColorStop(.45, col); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 2.4, 0, 7); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = T['scene-bg']; ctx.lineWidth = 1; ctx.stroke();
    if (p.labels) { ctx.fillStyle = T['scene-ink']; ctx.font = `bold 11px ${T.body}`; ctx.fillText(name, x + r + 4, y + r + 10); }
  };
  star(X(s.x1), Y(s.y1), r1, T['star-a'], '1');
  star(X(s.x2), Y(s.y2), r2, T['star-b'], '2');
  if (p.showV) { arrow(X(s.x1), Y(s.y1), s.vx1 * vs, -s.vy1 * vs, T['c4'], p.labels ? 'v₁' : ''); arrow(X(s.x2), Y(s.y2), s.vx2 * vs, -s.vy2 * vs, T['c4'], p.labels ? 'v₂' : ''); }
  if (p.showF) { arrow(X(s.x1), Y(s.y1), a.ax1 * s.m1 * fs, -a.ay1 * s.m1 * fs, T['c5'], p.labels ? 'F₁₂' : ''); arrow(X(s.x2), Y(s.y2), a.ax2 * s.m2 * fs, -a.ay2 * s.m2 * fs, T['c5'], p.labels ? 'F₂₁' : ''); }
  // barra de escala
  ctx.strokeStyle = T['scene-ink']; ctx.lineWidth = 2; const sb = stepAU * scale;
  ctx.beginPath(); ctx.moveTo(14, h - 34); ctx.lineTo(14 + sb, h - 34); ctx.stroke();
  ctx.fillStyle = T['scene-ink']; ctx.font = `11px ${T.mono}`; ctx.fillText(U.fmt(stepAU) + ' UA', 14, h - 40);
  exp.ovTL.innerHTML = `t = ${U.fmt(s.t, 4)} años<br>r = ${U.fmt(d.r, 4)} UA`;
  exp.ovBR.innerHTML = (p.showV ? `velocidades: 1 px = ${U.fmt(M.KMS_PER_AUYR / vs, 2)} km/s<br>` : '') + (p.showF ? 'fuerzas: escala visual relativa<br>' : '') + (inertial ? 'sistema inercial' : 'sistema del CM');
  exp.ovBL.textContent = '';
};

exp.drawCharts = function (force) {
  if (!force && exp.currentTab !== 'lab' && exp.currentTab !== 'charts') return;
  const S = exp.series, cs = exp.charts;
  let xr = null; const last = parseFloat(exp.rangeIn && exp.rangeIn.value);
  if (Number.isFinite(last) && last > 0 && S.t.length) { const tn = S.t[S.t.length - 1]; xr = [Math.max(0, tn - last), tn]; }
  const kepNA = exp.el0 && Math.abs(exp.el0.e - 1) < 1e-6 ? 'parabólica: no implementada' : null;
  const sep = [{ label: 'r numérico', x: S.t, y: S.r, color: 'c1' }, { label: 'r Kepler', x: S.t, y: S.rk, color: 'c2', dash: [5, 4], na: kepNA }];
  const en = [{ label: 'K', x: S.t, y: S.K, color: 'c4' }, { label: 'U', x: S.t, y: S.U, color: 'c3', dash: [6, 3] }, { label: 'E = K+U', x: S.t, y: S.E, color: 'c2', width: 2.2 }];
  cs.sep.set(sep); cs.energy.set(en);
  if (exp.currentTab === 'charts' || force) {
    cs.sepW.set(sep, { xRange: xr }); cs.energyW.set(en, { xRange: xr });
    cs.cons.set([{ label: '|ΔE|/' + exp.ErefNote, x: S.t, y: S.dE, color: 'c2' }, { label: '|ΔL/L₀|', x: S.t, y: S.dL, color: 'c1', dash: [5, 3], na: exp.d0 && exp.d0.L === 0 ? 'L₀ = 0' : null }], { xRange: xr });
    cs.kep.set([{ label: '|Δr|/a', x: S.t, y: S.dk, color: 'c5', na: kepNA }], { xRange: xr });
    cs.cmW.set([{ label: 'X_CM', x: S.t, y: S.cmx, color: 'c1' }, { label: 'Y_CM', x: S.t, y: S.cmy, color: 'c3', dash: [5, 3] }], { xRange: xr });
  }
};
exp.onTab = k => { if (k === 'charts') setTimeout(() => exp.drawCharts(true), 0); if (k === 'lab') setTimeout(() => { exp.draw(); exp.drawCharts(true); }, 0); };
exp.redraw = () => { exp.draw(); exp.drawCharts(true); };
exp.exportCSV = function () {
  const S = exp.series;
  const rows = S.t.map((t, i) => [t, S.r[i], S.rk[i], S.K[i], S.U[i], S.E[i], S.dE[i], S.dL[i], S.dk[i], S.cmx[i], S.cmy[i]]);

/* ==== reflector.js ==== */
'use strict';
/* =====================================================================
   EXPERIMENTO 2 · TELESCOPIO REFLECTOR NEWTONIANO
   Modelo: trazado geométrico exacto de rayos en 3D (no paraxial) para
   el espejo primario paraboloide y el secundario plano elíptico;
   ocular tratado como lente delgada ideal (aproximación paraxial
   declarada). Unidades: milímetros; ángulos internos en radianes.
   Geometría: eje óptico = eje x. El primario tiene su vértice en el
   origen y la superficie x = (y²+z²)/(4f); la luz llega desde +x.
   El secundario (45° nominal) envía el haz hacia +y, donde está el
   enfocador (eje paralelo a y que pasa por x = s).
   ===================================================================== */
(function () {
const { el, U } = LAB;
const R = LAB.reflectorModel = {};
const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]); return [a[0] / l, a[1] / l, a[2] / l]; };
const rotZ = (a, t) => [a[0] * Math.cos(t) - a[1] * Math.sin(t), a[0] * Math.sin(t) + a[1] * Math.cos(t), a[2]];
const reflect = (d, n) => sub(d, mul(n, 2 * dot(d, n)));
R.vec = { add, sub, mul, dot, norm, rotZ, reflect };

/** Geometría derivada de los parámetros. */
R.geometry = function (p) {
  const ds = p.secTilt * U.deg;
  const n = rotZ(norm([-1, 1, 0]), ds);              // normal del secundario
  const u = rotZ(norm([1, 1, 0]), ds);               // eje mayor del secundario (en el plano xy)
  return {
    D: p.D, f: p.f, s: p.secPos, b: p.secSize, ds,
    dp: p.primTilt / 60 * U.deg,                       // inclinación del primario (arcmin → rad), alrededor de z
    C: [p.secPos, p.secOffset, 0], n, u,
    yfp: p.focusY, fe: p.fe, xEnd: Math.max(p.f, p.secPos + p.D * 0.75),
    fieldStop: 2 * p.fe * Math.tan(p.afov / 2 * U.deg)  // diámetro del diafragma de campo del ocular
  };
};
/** Intersección con el paraboloide (en el sistema del espejo). Devuelve t>0 o null. */
function hitParab(o, d, f) {
  const k = 1 / (4 * f);
  const a = k * (d[1] * d[1] + d[2] * d[2]);
  const b = 2 * k * (o[1] * d[1] + o[2] * d[2]) - d[0];
  const c = k * (o[1] * o[1] + o[2] * o[2]) - o[0];
  let t;
  if (Math.abs(a) < 1e-15) t = -c / b;
  else {
    const disc = b * b - 4 * a * c; if (disc < 0) return null;
    const sq = Math.sqrt(disc), q = -0.5 * (b + Math.sign(b || 1) * sq);
    const t1 = q / a, t2 = c / q;
    const c1 = [t1, t2].filter(x => x > 1e-9).sort((x, y) => x - y);
    t = c1.length ? c1[0] : null;
  }
  return t !== null && t > 1e-9 ? t : null;
}
/** Intersección con el secundario elíptico. Devuelve {t,P} o null. */
function hitSecondary(o, d, g) {
  const den = dot(d, g.n); if (Math.abs(den) < 1e-14) return null;
  const t = dot(sub(g.C, o), g.n) / den; if (t <= 1e-9) return null;
  const P = add(o, mul(d, t)), q = sub(P, g.C);
  const uu = dot(q, g.u) / (g.b / Math.SQRT2), ww = q[2] / (g.b / 2);
  return uu * uu + ww * ww <= 1 ? { t, P } : null;
}
/**
 * Traza un rayo que entra paralelo con ángulo de campo α (rad, en el plano xy) y
 * atraviesa la abertura en (y0, z0). Devuelve {pts:[...], status, spot:[x,z], out:dir}.
 * status: 'ok' | 'blocked' (sombra del secundario) | 'missPrimary' | 'missSecondary' | 'noFocal'.
 */
R.trace = function (g, alpha, y0, z0, opts = {}) {
  const d0 = [-Math.cos(alpha), -Math.sin(alpha), 0];
  const startX = g.xEnd + 40;
  const L = startX / Math.cos(alpha);
  let o = sub([0, y0, z0], mul(d0, L));
  const pts = [o];
  // 1) obstrucción del secundario en el camino de entrada
  const hb = opts.noSecondary ? null : hitSecondary(o, d0, g);
  if (hb && hb.P[0] > 0) { pts.push(hb.P); return { pts, status: 'blocked' }; }
  // 2) primario (transformado al sistema del espejo inclinado dp alrededor de z)
  const oM = rotZ(o, -g.dp), dM = rotZ(d0, -g.dp);
  const t = hitParab(oM, dM, g.f);
  if (t === null) return { pts, status: 'missPrimary' };
  const PM = add(oM, mul(dM, t));
  if (PM[1] * PM[1] + PM[2] * PM[2] > (g.D / 2) ** 2 * (1 + 1e-12)) { pts.push(rotZ(PM, g.dp)); return { pts, status: 'missPrimary' }; }

  pts.push(P1);

  const hs = hitSecondary(P1, d1, g);
  if (!hs) { const tt = (g.xEnd - P1[0]) / d1[0]; pts.push(add(P1, mul(d1, Math.max(tt, 0)))); return { pts, status: 'missSecondary' }; }
  const d2 = reflect(d1, g.n);
  pts.push(hs.P);

  if (d2[1] <= 1e-9) { pts.push(add(hs.P, mul(d2, 50))); return { pts, status: 'noFocal' }; }
  const tf = (g.yfp - hs.P[1]) / d2[1];

  const tl = g.fe / d2[1];

/** Rejilla de rayos sobre la abertura circular (para diagrama de manchas). */
R.grid = function (D, n) {
  const pts = [];
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const y = -D / 2 + (i + 0.5) * D / n, z = -D / 2 + (j + 0.5) * D / n;
    if (y * y + z * z <= (D / 2) ** 2) pts.push([y, z]);
  }
  return pts;
};
/** Diagrama de manchas: centroide, radio RMS y máximo en el plano focal. */
R.spot = function (g, alpha, n = 25) {
  const xs = [], zs = []; let blocked = 0, lost = 0, total = 0, outStop = 0;
  for (const [y, z] of R.grid(g.D, n)) {
    total++;
    const r = R.trace(g, alpha, y, z);
    if (r.status === 'blocked') { blocked++; continue; }
    if (r.status !== 'ok') { lost++; continue; }
    if (!r.inStop) outStop++;
    xs.push(r.spot[0]); zs.push(r.spot[1]);
  }
  const cx = U.mean(xs), cz = U.mean(zs);
  let s2 = 0, mx = 0; for (let i = 0; i < xs.length; i++) { const d2 = (xs[i] - cx) ** 2 + (zs[i] - cz) ** 2; s2 += d2; mx = Math.max(mx, Math.sqrt(d2)); }
  return { xs, zs, cx, cz, rms: xs.length ? Math.sqrt(s2 / xs.length) : NaN, rmax: mx, blocked, lost, total, outStop, used: xs.length };
};
/** Mejor foco: busca la posición del plano focal que minimiza el radio RMS (sección áurea). */
R.bestFocus = function (p, alpha) {
  const f = y => { const r = R.spot(R.geometry(Object.assign({}, p, { focusY: y })), alpha, 13).rms; return Number.isFinite(r) ? r : Infinity; };
  const nominal = p.f - p.secPos + p.secOffset; // reflexión del foco (f,0) en el plano del secundario
  let a = nominal - 40, b = nominal + 40;
  const gr = (Math.sqrt(5) - 1) / 2;
  let c = b - gr * (b - a), d = a + gr * (b - a), fc = f(c), fd = f(d);
  for (let i = 0; i < 80; i++) {
    if (fc < fd) { b = d; d = c; fd = fc; c = b - gr * (b - a); fc = f(c); }
    else { a = c; c = d; fc = fd; d = a + gr * (b - a); fd = f(d); }
    if (b - a < 1e-7) break;
  }
  return (a + b) / 2;
};
/**
 * Desviación angular del haz (en el plano xy) introducida por la desalineación:
 * dirección de un mismo rayo (fuera de la sombra del secundario) en el sistema
 * real menos la del sistema colimado. Devuelve NaN si el rayo no llega.
 */
R.beamDeviation = function (p, y0) {
  const yy = y0 === undefined ? 0.35 * p.D : y0;
  const a = R.trace(R.geometry(p), 0, yy, 0);
  const b = R.trace(R.geometry(Object.assign({}, p, { secTilt: 0, secOffset: 0, primTilt: 0 })), 0, yy, 0);
  if (!a.dFocal || !b.dFocal) return NaN;
  return Math.atan2(a.dFocal[0], a.dFocal[1]) - Math.atan2(b.dFocal[0], b.dFocal[1]);
};
/** Magnitudes ópticas del sistema ideal. */
R.derived = function (p) {
  const lam = p.lambda * 1e-6; // nm → mm
  const N = p.f / p.D, Mg = p.f / p.fe;
  const theta = 1.22 * lam / p.D; // rad (límite de Rayleigh)

    N, M: Mg, theta, thetaArcsec: theta * U.ARCSEC_PER_RAD,
    airyR: 1.22 * lam * N,                   // mm en el plano focal

    obstr: (p.secSize / p.D) ** 2,
    tfovDeg: p.afov / Mg,                     // aproximación: campo aparente / aumento
    tfovStopDeg: 2 * Math.atan(p.fe * Math.tan(p.afov / 2 * U.deg) / p.f) / U.deg,
    bMin: p.D * (p.f - p.secPos) / p.f,       // haz axial en el secundario (eje menor)
    plate: U.ARCSEC_PER_RAD / p.f,           // arcsec por mm
    focusNominal: p.f - p.secPos,
    eyeRelief: p.fe * (p.f + p.fe) / p.f,
    maxUseful: 2 * p.D,                       // regla práctica: 2× por mm de abertura
    comaTheory: 3 * (Math.abs(p.field) / 60 * U.deg) / (16 * N * N) // longitud angular de coma tangencial (rad)
  };
};

  if (exp.valid) {
    const sp = exp.sp;
    if (p.f - p.secPos < p.D / 2 + 10) msgs.push(['bad', `El foco sobre el eje (${U.fmt(dv.focusNominal, 4)} mm) queda dentro del tubo (radio ≈ ${U.fmt(p.D / 2 + 10, 3)} mm): el ocular no podría alcanzarlo. Acerque el secundario al primario.`]);
    if (p.secSize < dv.bMin) msgs.push(['warn', `El secundario (${p.secSize} mm) es menor que el haz axial (${U.fmt(dv.bMin, 3)} mm): se pierde luz incluso en el eje.`]);
    if (sp.used === 0) msgs.push(['bad', 'Ningún rayo llega al plano focal: revise la alineación.']);
    else {
      const c = Math.hypot(sp.cx, sp.cz);
      if (c > g.fieldStop / 2) msgs.push(['bad', `La imagen está a ${U.fmt(c, 3)} mm del eje del ocular, fuera de su diafragma de campo (radio ${U.fmt(g.fieldStop / 2, 3)} mm): no se vería la estrella.`]);
      else if (c > 0.05 && p.field === 0) msgs.push(['warn', `Estrella en el eje, pero la imagen está ${U.fmt(c, 3)} mm fuera del eje del ocular: el instrumento está desalineado.`]);
      const df = p.focusY - exp.best;
      if (sp.rms > dv.airyR && Math.abs(df) > 0.05) msgs.push(['warn', `Desenfocado ${U.fmt(df, 3)} mm: mancha RMS ${U.fmt(sp.rms * 1000, 3)} µm frente a Airy ${U.fmt(dv.airyR * 1000, 3)} µm. Use «Enfocar».`]);
      else if (sp.rms <= dv.airyR) msgs.push(['ok', `Mancha geométrica RMS (${U.fmt(sp.rms * 1000, 3)} µm) menor que el radio de Airy (${U.fmt(dv.airyR * 1000, 3)} µm): aproximadamente limitado por difracción (criterio geométrico).`]);
      else msgs.push(['warn', `Mancha RMS ${U.fmt(sp.rms * 1000, 3)} µm mayor que Airy: dominan las aberraciones (coma o desalineación).`]);
      if (sp.lost > 0) msgs.push(['warn', `${U.fmt(sp.lost / sp.total * 100, 3)} % de los rayos no alcanza el plano focal (viñeteo por el secundario o desalineación).`]);
      if (sp.outStop > 0 && sp.outStop < sp.used) msgs.push(['warn', 'Parte de la mancha cae fuera del diafragma de campo del ocular.']);
    }
    if (dv.exitPupil > 7) msgs.push(['info', `Pupila de salida ${U.fmt(dv.exitPupil, 3)} mm > 7 mm: el ojo no aprovecha toda la luz (aumento mínimo útil ≈ D/7 = ${U.fmt(p.D / 7, 3)}×).`]);
    if (dv.M > dv.maxUseful) msgs.push(['info', `Aumento ${U.fmt(dv.M, 3)}× mayor que la regla práctica de 2×/mm (${U.fmt(dv.maxUseful, 3)}×): la imagen se agranda sin mostrar más detalle.`]);
  }
  msgs.push(['info', 'Aumento, captación y resolución son magnitudes distintas: el aumento depende de f/f_oc; la captación de D²; la resolución de λ/D. La atmósfera (seeing ≈ 1–2″) suele limitar más que la difracción.']);
  LAB.setMsgs(exp.msgs, msgs);
  exp.draw(); exp.drawCharts();
};

/* --------- dibujo del trazado (sección meridiana, escala uniforme) --------- */
exp.draw = function () {
  const cv = exp.canvas; if (!cv || !cv.isConnected || cv.clientWidth === 0 || !exp.g) return;
  const { ctx, w, h } = LAB.fitCanvas(cv), T = LAB.theme(), p = exp.panel.values, g = R.geometry(p);
  ctx.fillStyle = T['scene-bg']; ctx.fillRect(0, 0, w, h);
  const tubeR = p.D / 2 + 10;
  // región del mundo según la vista
  let xmin, xmax, ymin, ymax;
  if (p.view === 'focal') { const cx = p.secPos + (exp.sp && exp.sp.used ? exp.sp.cx : 0), span = Math.max(6, (exp.sp && exp.sp.rmax || 0) * 8, Math.abs(p.focusY - (exp.best || p.focusY)) * 4); xmin = cx - span; xmax = cx + span; ymin = p.focusY - span; ymax = p.focusY + span; }
  else if (p.view === 'sec') { const span = Math.max(p.secSize * 1.4, 30); xmin = p.secPos - span; xmax = p.secPos + span; ymin = -span; ymax = span; }
  else { xmin = -30; xmax = g.xEnd + 150; ymin = -tubeR - 20; ymax = Math.max(p.focusY + p.fe + R.derived(p).eyeRelief * 1.3, tubeR + 30); }
  const sc = Math.min(w / (xmax - xmin), h / (ymax - ymin));
  const ox = (w - (xmax - xmin) * sc) / 2, oy = (h - (ymax - ymin) * sc) / 2;
  // luz que llega desde la derecha: x crece hacia la derecha en pantalla
  const X = x => ox + (x - xmin) * sc, Y = y => h - oy - (y - ymin) * sc;
  ctx.lineJoin = 'round';
  // tubo
  ctx.strokeStyle = T['ink-3']; ctx.lineWidth = 1.2; ctx.globalAlpha = .7;
  ctx.beginPath(); ctx.moveTo(X(-15), Y(tubeR)); ctx.lineTo(X(g.xEnd), Y(tubeR)); ctx.moveTo(X(-15), Y(-tubeR)); ctx.lineTo(X(g.xEnd), Y(-tubeR)); ctx.moveTo(X(-15), Y(-tubeR)); ctx.lineTo(X(-15), Y(tubeR)); ctx.stroke();
  // enfocador
  ctx.strokeRect(X(p.secPos - 16), Y(Math.max(p.focusY, tubeR + 5)), 32 * sc, (Math.max(p.focusY, tubeR + 5) - tubeR) * sc);
  ctx.globalAlpha = 1;
  // ejes
  if (p.showAxis) {
    ctx.strokeStyle = T['ink-3']; ctx.setLineDash([10, 4, 2, 4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(X(-25), Y(0)); ctx.lineTo(X(g.xEnd + 25), Y(0)); ctx.moveTo(X(p.secPos), Y(-5)); ctx.lineTo(X(p.secPos), Y(p.focusY + p.fe * 2.5)); ctx.stroke(); ctx.setLineDash([]);
  }
  // primario (perfil parabólico, inclinado dp)
  ctx.strokeStyle = T.mirror; ctx.lineWidth = 3; ctx.beginPath();
  for (let i = 0; i <= 60; i++) { const y = -p.D / 2 + p.D * i / 60; const P = rotZ([y * y / (4 * p.f), y, 0], g.dp); const px = X(P[0]), py = Y(P[1]); if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py); }
  ctx.stroke();
  // secundario (sección)
  const a = g.b / Math.SQRT2, s1 = add(g.C, mul(g.u, -a)), s2 = add(g.C, mul(g.u, a));
  ctx.strokeStyle = T.mirror; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(X(s1[0]), Y(s1[1])); ctx.lineTo(X(s2[0]), Y(s2[1])); ctx.stroke();
  // ocular (lente delgada)
  const ly = p.focusY + p.fe, lr = Math.max(g.fieldStop / 2 + 3, 8);
  ctx.strokeStyle = T['ray-2']; ctx.fillStyle = T.glass; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(X(p.secPos), Y(ly), lr * sc, Math.max(2, 1.6 * sc), 0, 0, 7); ctx.fill(); ctx.stroke();
  // diafragma de campo
  ctx.strokeStyle = T['ink-2']; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(X(p.secPos - g.fieldStop / 2 - 6), Y(p.focusY)); ctx.lineTo(X(p.secPos - g.fieldStop / 2), Y(p.focusY)); ctx.moveTo(X(p.secPos + g.fieldStop / 2), Y(p.focusY)); ctx.lineTo(X(p.secPos + g.fieldStop / 2 + 6), Y(p.focusY)); ctx.stroke();
  // rayos
  const drawSet = (alpha, color, dash, faded) => {
    const n = p.nRays;
    for (let i = 0; i < n; i++) {
      const y0 = -p.D / 2 * 0.98 + (p.D * 0.98) * i / (n - 1);
      const r = R.trace(g, alpha, y0, 0);
      ctx.strokeStyle = color; ctx.lineWidth = 1.1; ctx.setLineDash(dash); ctx.globalAlpha = faded ? .45 : (r.status === 'blocked' ? .35 : .9);
      ctx.beginPath(); r.pts.forEach((P, k) => { if (k === 0) ctx.moveTo(X(P[0]), Y(P[1])); else ctx.lineTo(X(P[0]), Y(P[1])); });
      if (r.status === 'ok' && r.inStop && r.out) { const L = R.derived(p).eyeRelief * 1.3; ctx.lineTo(X(r.Pl[0] + r.out[0] / r.out[1] * L), Y(r.Pl[1] + L)); }
      ctx.stroke(); ctx.setLineDash([]);
      if (r.status === 'blocked' || r.status === 'missSecondary') { const P = r.pts[r.pts.length - 1]; ctx.globalAlpha = .8; ctx.beginPath(); ctx.moveTo(X(P[0]) - 3, Y(P[1]) - 3); ctx.lineTo(X(P[0]) + 3, Y(P[1]) + 3); ctx.moveTo(X(P[0]) + 3, Y(P[1]) - 3); ctx.lineTo(X(P[0]) - 3, Y(P[1]) + 3); ctx.stroke(); }
      ctx.globalAlpha = 1;
    }
  };
  if (p.showRays && exp.valid) {
    if (p.compareAxis && p.field !== 0) drawSet(0, T['ray-2'], [5, 4], true);
    drawSet(p.field / 60 * U.deg, T.ray, [], false);
  }
  // focos
  if (p.showFoci) {
    ctx.fillStyle = T.accent; ctx.strokeStyle = T.accent; ctx.lineWidth = 1.5;
    const Fp = rotZ([p.f, 0, 0], g.dp);
    ctx.beginPath(); ctx.arc(X(Fp[0]), Y(Fp[1]), 4, 0, 7); ctx.stroke();
    if (exp.sp && exp.sp.used) { ctx.beginPath(); ctx.arc(X(p.secPos + exp.sp.cx), Y(exp.best), 4, 0, 7); ctx.fill(); }
    if (p.showLabels) {
      ctx.font = `11px ${T.body}`; ctx.fillStyle = T['scene-ink'];
      ctx.fillText('F primario (sin secundario)', X(Fp[0]) + 6, Y(Fp[1]) + 14);
      if (exp.sp && exp.sp.used) { ctx.textAlign = 'right'; ctx.fillText('foco', X(p.secPos + exp.sp.cx) - 8, Y(exp.best) + 4); ctx.textAlign = 'left'; }
    }
  }
  if (p.showLabels && p.view === 'full') {
    ctx.font = `11px ${T.body}`; ctx.fillStyle = T['scene-ink'];
    ctx.fillText('primario', X(0) + 6, Y(-p.D / 2) + 14); ctx.fillText('secundario', X(p.secPos) + 8, Y(-12)); ctx.fillText('ocular', X(p.secPos) + lr * sc + 6, Y(ly) + 4); ctx.fillText('luz incidente →', X(g.xEnd) - 90, Y(tubeR) - 8);
  }
  // barra de escala
  const bar = Math.pow(10, Math.floor(Math.log10((xmax - xmin) / 5)));
  ctx.strokeStyle = T['scene-ink']; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(14, h - 16); ctx.lineTo(14 + bar * sc, h - 16); ctx.stroke();
  ctx.fillStyle = T['scene-ink']; ctx.font = `11px ${T.mono}`; ctx.fillText(U.fmt(bar) + ' mm', 14, h - 22);
  exp.ovTL.innerHTML = `f/${U.fmt(R.derived(p).N, 3)} · M = ${U.fmt(R.derived(p).M, 4)}×<br>${p.view === 'full' ? 'escala real (sin exagerar)' : 'vista ampliada, escala uniforme'}`;
  exp.ovBR.innerHTML = 'rayos que llegan desde la derecha · ✕ = rayo obstruido o perdido' + (p.compareAxis && p.field !== 0 ? '<br>discontinuo: estrella en el eje' : '');
  exp.drawSpot();
};
exp.drawSpot = function () {
  const cv = exp.spotCanvas; if (!cv || !cv.isConnected || cv.clientWidth === 0) return;
  const { ctx, w, h } = LAB.fitCanvas(cv), T = LAB.theme(), sp = exp.sp, dv = exp.dv;
  ctx.clearRect(0, 0, w, h);
  ctx.font = `11px ${T.body}`;
  if (!sp || !sp.used) { ctx.fillStyle = T['ink-3']; ctx.textAlign = 'center'; ctx.fillText('Ningún rayo alcanza el plano focal', w / 2, h / 2); ctx.textAlign = 'left'; return; }
  const um = 1000, ext = Math.max(dv.airyR * 3, sp.rmax * 1.25) * um;
  const sc = Math.min(w, h - 20) / (2 * ext), cx = w / 2, cy = (h - 14) / 2;
  ctx.strokeStyle = T.line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.moveTo(cx, 0); ctx.lineTo(cx, h - 14); ctx.stroke();
  ctx.strokeStyle = T.data; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.arc(cx, cy, dv.airyR * um * sc, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = T.ray;
  for (let i = 0; i < sp.xs.length; i++) { ctx.fillRect(cx + (sp.xs[i] - sp.cx) * um * sc - 1, cy - (sp.zs[i] - sp.cz) * um * sc - 1, 2, 2); }
  // eje del ocular
  const ax = cx + (0 - sp.cx) * um * sc, az = cy - (0 - sp.cz) * um * sc;
  if (ax > 0 && ax < w && az > 0 && az < h) { ctx.strokeStyle = T.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(ax - 6, az - 6); ctx.lineTo(ax + 6, az + 6); ctx.moveTo(ax + 6, az - 6); ctx.lineTo(ax - 6, az + 6); ctx.stroke(); }
  const bar = Math.pow(10, Math.floor(Math.log10(ext)));
  ctx.strokeStyle = T['ink-2']; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(8, h - 6); ctx.lineTo(8 + bar * sc, h - 6); ctx.stroke();
  ctx.fillStyle = T['ink-2']; ctx.font = `11px ${T.mono}`;
  ctx.fillText(U.fmt(bar) + ' µm', 12 + bar * sc, h - 3);
  ctx.textAlign = 'right'; ctx.fillText(`RMS ${U.fmt(sp.rms * um, 3)} µm · Airy ${U.fmt(dv.airyR * um, 3)} µm`, w - 6, 12); ctx.fillText(`horizontal: x (a lo largo del tubo) · vertical: z`, w - 6, 26); ctx.textAlign = 'left';
};
exp.drawCharts = function () {
  if (!exp.p) return;
  const p = exp.p, lam = [450, 550, 650];
  const Ds = []; for (let D = 50; D <= 600; D += 10) Ds.push(D);
  const res = lam.map((l, i) => ({ label: l + ' nm', x: Ds, y: Ds.map(D => 1.22 * l * 1e-6 / D * U.ARCSEC_PER_RAD), color: ['c1', 'c4', 'c2'][i], dash: [[], [6, 3], [2, 3]][i] }));
  res.push({ label: 'actual', x: [p.D], y: [exp.dv.thetaArcsec], color: 'ink', points: true });
  exp.cRes.set(res); exp.cRes2.set(res);
  const Ls = []; for (let l = 380; l <= 1000; l += 10) Ls.push(l);
  exp.cLam.set([{ label: 'D = ' + p.D + ' mm', x: Ls, y: Ls.map(l => 1.22 * l * 1e-6 / p.D * U.ARCSEC_PER_RAD), color: 'c1' }, { label: 'actual', x: [p.lambda], y: [exp.dv.thetaArcsec], color: 'ink', points: true }]);
  if (exp.currentTab !== 'charts') { exp.drawSpot(); return; } // curvas costosas: solo con la pestaña visible
  if (exp.valid && Number.isFinite(exp.best)) {
    const xs = [], ys = [], alpha = p.field / 60 * U.deg;
    for (let k = -20; k <= 20; k++) { const d = k * 0.15; xs.push(d); ys.push(R.spot(R.geometry(Object.assign({}, p, { focusY: exp.best + d })), alpha, 13).rms * 1000); }
    exp.defocusCurve = { xs, ys };
    exp.cDef.set([{ label: 'RMS trazado', x: xs, y: ys, color: 'c2' }, { label: 'radio de Airy', x: [xs[0], xs[xs.length - 1]], y: [exp.dv.airyR * 1000, exp.dv.airyR * 1000], color: 'c1', dash: [5, 3] }, { label: 'actual', x: [p.focusY - exp.best], y: [exp.sp.rms * 1000], color: 'ink', points: true }]);
    const as = [], rs = [], th = [];
    for (let k = 0; k <= 12; k++) {
      const am = k * 5, al = am / 60 * U.deg; as.push(am);
      const pp = Object.assign({}, p, { primTilt: 0, secTilt: 0, secOffset: 0 });
      pp.focusY = R.bestFocus(pp, al);
      rs.push(R.spot(R.geometry(pp), al, 15).rms / p.f * U.ARCSEC_PER_RAD);
      th.push(3 * al / (16 * exp.dv.N ** 2) * U.ARCSEC_PER_RAD);
    }
    exp.comaCurve = { as, rs, th };
    exp.cComa.set([{ label: 'RMS trazado (colimado, mejor foco)', x: as, y: rs, color: 'c2' }, { label: 'coma tangencial teórica 3θ/(16N²)', x: as, y: th, color: 'c3', dash: [5, 3] }, { label: 'Rayleigh', x: [0, 60], y: [exp.dv.thetaArcsec, exp.dv.thetaArcsec], color: 'c1', dash: [2, 3] }]);
  } else { exp.cDef.set([], { empty: 'Configuración sin solución válida' }); exp.cComa.set([], { empty: 'Configuración sin solución válida' }); }
  exp.drawSpot();
};
exp.onTab = k => { setTimeout(() => { exp.draw(); exp.drawCharts(); }, 0); };
exp.redraw = () => { exp.draw(); exp.drawCharts(); };
exp.exportCSV = function () {

  let txt = '# Laboratorio Astrofísico · Reflector newtoniano · ' + U.nowStamp() + '\n# params ' + JSON.stringify(exp.p) + '\n# diagrama de manchas (mm, relativo al eje del ocular)\n';

  if (exp.comaCurve) txt += '\n# mancha frente al campo\n' + LAB.io.toCSV(['campo_arcmin', 'rms_arcsec', 'coma_teorica_arcsec'], exp.comaCurve.as.map((x, i) => [x, exp.comaCurve.rs[i], exp.comaCurve.th[i]]));

  <h3>Limitaciones</h3><p>Ocular ideal paraxial; difracción solo como escala; sin atmósfera ni errores de superficie; sección meridiana dibujada, mancha calculada en 3D.</p>`;

/* ------------------------------ guía ------------------------------ */
const guide = {
  objective: 'Comprender cómo el primario parabólico concentra la luz, cómo el secundario plano la desvía hacia el ocular, y distinguir aumento, captación de luz y resolución.',
  intro: '<p>Un paraboloide refleja todos los rayos paralelos a su eje hacia un único punto, el foco, situado a la distancia f. Antes de llegar al foco, un espejo plano a 45° desvía el haz 90° hacia un lateral del tubo, donde el ocular amplía la imagen.</p><p>El aumento solo depende de las distancias focales; la abertura D decide cuánta luz se recoge y el detalle más fino que permite la difracción.</p>',
  refScenario: 'aligned',
  equations: '<div class="eq">|M| ≈ f_objetivo / f_ocular        N = f / D</div><div class="eq">θ_min ≈ 1,22 λ / D  [rad]  ·  1 rad = 206 264,8″</div><div class="eq">radio de Airy en el foco = 1,22 λ N</div><div class="eq">pupila de salida = D / M        captación ∝ D²</div><div class="eq">giro δ del secundario → desviación 2δ del haz</div><p>Convenciones: eje óptico x, luz entrando desde +x; el secundario envía el haz hacia +y. Ángulos de desalineación positivos en sentido antihorario en la vista.</p>',
  limits: '<p>El ocular es una lente delgada ideal; el campo real «campo aparente / M» es una aproximación. No se simulan la atmósfera, la figura de difracción completa, errores de pulido ni la araña del secundario. La vista muestra la sección meridiana; la mancha se calcula con rayos en 3D.</p>',
  questions: [
    { kind: 'predict', title: 'Abertura y aumento', text: 'Si duplica el diámetro D manteniendo f y el ocular, ¿qué ocurre con el aumento?', options: ['Se duplica', 'No cambia', 'Se reduce a la mitad', 'Se multiplica por 4'], answer: 1, explain: 'M = f/f_oc no depende de D. Lo que cambia es la captación (×4) y la resolución (θ_min a la mitad).' },
    { kind: 'predict', title: 'Secundario inclinado', text: 'Si el secundario gira 1° respecto de 45°, ¿cuánto se desvía el haz reflejado?', options: ['0,5°', '1°', '2°', 'No se desvía'], answer: 2, explain: 'Al girar un espejo un ángulo δ, el rayo reflejado gira 2δ. Compare «Desviación del haz» en el escenario «secundario inclinado».', scenario: 'secTilt' },
    { kind: 'question', title: 'Color y resolución', text: '¿Con qué luz resuelve mejor un mismo telescopio?', options: ['Roja (650 nm)', 'Verde (550 nm)', 'Azul (450 nm)', 'Igual en todas'], answer: 2, explain: 'θ_min ∝ λ: la luz de menor longitud de onda da un disco de Airy más pequeño.' },
    { kind: 'question', title: 'Coma', text: 'Para una estrella a 20′ del eje, ¿qué telescopio muestra menos coma con la misma abertura?', options: ['f/5', 'f/8', 'Ambos igual', 'Depende del ocular'], answer: 1, explain: 'La coma del paraboloide crece como θ/N². Compare los escenarios f/5 y f/8 fuera del eje.', scenario: 'coma8' }
  ],
  conclude() {
    if (!exp.p) return 'Sin datos.';
    const p = exp.p, dv = exp.dv, sp = exp.sp;

'use strict';
/* =====================================================================
   EXPERIMENTO 3 · TELESCOPIO REFRACTOR
   Modelo: lentes delgadas en la aproximación paraxial (explícita).
   Convención de signos («real es positivo», gaussiana):
     · la luz viaja de izquierda a derecha;
     · d_o > 0 para un objeto real a la izquierda de la lente;
     · d_i > 0 para una imagen real a la derecha; d_i < 0 imagen virtual (a la izquierda);
     · f > 0 lente convergente, f < 0 divergente;
     · ecuación: 1/f = 1/d_o + 1/d_i ; aumento lateral m = −d_i/d_o.
   Trazado: transferencia paraxial (y, u) con u = pendiente del rayo:
     espacio libre y' = y + u·d ; lente u' = u − y/f.
   Fabricante de lentes (lente delgada): 1/f = (n−1)(1/R₁ − 1/R₂),
     R > 0 si el centro de curvatura está a la derecha de la superficie.
   Dispersión (opcional): Cauchy n(λ) = A + B/λ² (vidrio tipo BK7).
   Unidades: mm.
   ===================================================================== */
(function () {
const { el, U } = LAB;
const F = LAB.refractorModel = {};
F.BK7 = { A: 1.5046, B: 0.00420 }; // B en µm²

/** Imagen de una lente delgada. dO puede ser ±Infinity (objeto en el infinito). */
F.image = function (f, dO) {
  if (!Number.isFinite(f) || f === 0) return { valid: false, reason: 'distancia focal nula o no finita' };
  if (!Number.isFinite(dO)) return { valid: true, di: f, inf: false, m: 0, objInf: true };
  if (dO === 0) return { valid: true, di: 0, m: 1, inf: false };
  const P = 1 / f - 1 / dO;
  if (Math.abs(P) < 1e-12 / Math.abs(f)) return { valid: true, di: Infinity, inf: true, m: Infinity };
  const di = 1 / P;
  return { valid: true, di, inf: false, m: -di / dO };
};
F.lensmaker = function (n, R1, R2) {
  const c = (Number.isFinite(R1) ? 1 / R1 : 0) - (Number.isFinite(R2) ? 1 / R2 : 0);
  if (n <= 1) return { valid: false, reason: 'índice de refracción ≤ 1' };
  if (Math.abs(c) < 1e-12) return { valid: false, reason: 'las dos curvaturas se anulan: la lente no tiene potencia (f = ∞)' };
  return { valid: true, f: 1 / ((n - 1) * c) };
};
F.cauchy = (lambdaNm, g = F.BK7) => g.A + g.B / ((lambdaNm / 1000) ** 2);
/** Transferencia paraxial de un rayo por una lista de lentes [{x,f,ap}], empezando en x0. */
F.trace = function (x0, y0, u0, lenses) {
  let x = x0, y = y0, u = u0;
  const pts = [[x, y]];
  for (let i = 0; i < lenses.length; i++) {
    const L = lenses[i];
    y += u * (L.x - x); x = L.x; pts.push([x, y]);
    if (L.ap && Math.abs(y) > L.ap / 2) return { pts, blocked: i, y, u, x };
    u = u - y / L.f;
  }
  return { pts, blocked: -1, y, u, x };
};
F.focalFromParams = function (p, lambda) {
  if (p.mode1 === 'lensmaker') {
    const n = p.dispersion ? F.cauchy(lambda || p.lambda) : p.n;
    const R1 = p.r1s === 'plano' ? Infinity : (p.r1s === '+' ? 1 : -1) * p.R1;
    const R2 = p.r2s === 'plano' ? Infinity : (p.r2s === '+' ? 1 : -1) * p.R2;
    const lm = F.lensmaker(n, R1, R2);
    return Object.assign(lm, { n, R1, R2 });
  }
  return { valid: true, f: (p.f1sign === '-' ? -1 : 1) * p.f1 };
};
/** Análisis completo del sistema (objetivo + ocular opcional). */
F.system = function (p, lambda) {
  const r = { msgs: [] };
  const f1r = F.focalFromParams(p, lambda);
  if (!f1r.valid) return { valid: false, reason: 'Objetivo: ' + f1r.reason };
  const f1 = f1r.f, f2 = (p.f2sign === '-' ? -1 : 1) * p.f2;
  const single = p.config === 'single';
  const dO = p.objInf ? Infinity : p.dObj;
  const L = p.L;
  const lenses = [{ x: 0, f: f1, ap: p.D1 }];
  if (!single) lenses.push({ x: L, f: f2, ap: p.D2 });
  const i1 = F.image(f1, dO);
  Object.assign(r, { valid: true, f1, f2, L, dO, single, lenses, i1, n: f1r.n });
  r.x1 = i1.inf ? Infinity : i1.di;          // posición de la imagen intermedia (respecto de la lente 1)
  r.h1 = p.objInf ? -f1 * Math.tan(p.alpha * U.deg) : (i1.inf ? Infinity : i1.m * p.hObj);
  r.real1 = !i1.inf && i1.di > 0;
  if (!single) {
    const dO2 = i1.inf ? -Infinity : L - i1.di; // > 0: objeto real para el ocular; < 0: objeto virtual
    const i2 = F.image(f2, Number.isFinite(dO2) ? dO2 : Infinity);
    r.dO2 = dO2; r.i2 = i2;
    r.x2 = i2.inf ? Infinity : L + i2.di;
    r.real2 = !i2.inf && i2.di > 0;
    if (!p.objInf && !i1.inf && !i2.inf && Number.isFinite(dO2)) { r.m = i1.m * i2.m; r.h2 = r.m * p.hObj; }
    r.afocalErr = L - (f1 + f2);
    r.Mafocal = -f1 / f2;
    // pupila de salida: imagen del objetivo a través del ocular
    const ep = F.image(f2, L);
    r.eyeRelief = ep.inf ? Infinity : ep.di; r.exitPupil = Math.abs(p.D1 * (ep.inf ? Infinity : ep.m));
  } else { r.x2 = r.x1; r.real2 = r.real1; r.m = p.objInf ? NaN : i1.m; r.h2 = r.h1; }
  // aumento angular medido con el rayo principal (centro del objetivo)
  const uIn = p.objInf ? Math.tan(p.alpha * U.deg) : p.hObj / (Number.isFinite(dO) ? dO : 1);
  const chief = F.trace(-1, -uIn * 1 * 0 + 0 - uIn * 1, uIn, lenses.map(l => Object.assign({}, l, { ap: 0 })));
  r.Mang = chief.u / uIn;
  return r;
};
/** Haz de rayos de un punto objeto (o del infinito con ángulo α) a través de la abertura del objetivo. */
F.fan = function (p, sys, n, xStart) {
  const rays = [];
  const D = p.D1;
  for (let k = 0; k < n; k++) {
    const yl = -D / 2 * 0.96 + D * 0.96 * k / Math.max(1, n - 1);
    let y0, u0;
    if (p.objInf) { u0 = Math.tan(p.alpha * U.deg); y0 = yl - u0 * (0 - xStart); }
    else { u0 = (yl - p.hObj) / p.dObj; y0 = p.hObj; xStart = -p.dObj; }
    rays.push(F.trace(xStart, y0, u0, sys.lenses));
  }
  return rays;
};
/** Dispersión de las alturas de los rayos en un plano x (diámetro de la mancha). */
F.blurAt = function (rays, x) {
  let mn = Infinity, mx = -Infinity, k = 0;
  for (const r of rays) { if (r.blocked >= 0 || x < r.x) continue; const y = r.y + r.u * (x - r.x); mn = Math.min(mn, y); mx = Math.max(mx, y); k++; }
  return k ? mx - mn : NaN;
};

exp.update = function () {

  }

exp.draw = function () {
  const cv = exp.canvas; if (!cv || !cv.isConnected || cv.clientWidth === 0 || !exp.p) return;

      if (Math.abs(p.dObj - sys.f1) > 1e-9) pr.push(F.trace(-p.dObj, p.hObj, -p.hObj / (p.dObj - sys.f1), noAp)); // por F → paralelo
    }
    pr.forEach((r, k) => { drawRay(r, T.ink, 1.6, [[], [7, 3], [2, 3]][k], .9); if (wantBack) backExt(r, lastX, sys.x2, T.ink); });
    if (!sys.single && Number.isFinite(sys.x1) && sys.x1 > lastX && !sys.real1) { /* imagen intermedia virtual tras el ocular: sin dibujo extra */ }
  }
  // imágenes como flechas
  const arrowV = (x, hgt, col, dashed, label) => {
    if (!Number.isFinite(x) || !Number.isFinite(hgt)) return;
    if (!inView(x)) { // indicador en el borde
      const ex = x > xmax ? w - 6 : 6; ctx.fillStyle = col; ctx.font = `11px ${T.body}`; ctx.textAlign = x > xmax ? 'right' : 'left';
      ctx.fillText((x > xmax ? '' : '← ') + label + ' fuera de vista (x = ' + U.fmt(x, 4) + ' mm)' + (x > xmax ? ' →' : ''), ex, Y(0) - 18 - (label.includes('final') ? 16 : 0)); ctx.textAlign = 'left'; return;
    }
    ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.2; ctx.setLineDash(dashed ? [4, 3] : []);
    ctx.beginPath(); ctx.moveTo(X(x), Y(0)); ctx.lineTo(X(x), Y(hgt)); ctx.stroke(); ctx.setLineDash([]);
    const dir = hgt >= 0 ? 1 : -1; ctx.beginPath(); ctx.moveTo(X(x), Y(hgt)); ctx.lineTo(X(x) - 5, Y(hgt) + dir * 9); ctx.lineTo(X(x) + 5, Y(hgt) + dir * 9); ctx.closePath(); ctx.fill();
    if (p.showLabels) { ctx.font = `11px ${T.body}`; ctx.fillText(label, X(x) + 6, Y(hgt) + (dir > 0 ? -4 : 14)); }
  };
  if (!p.objInf) arrowV(-p.dObj, p.hObj, T.good, false, 'objeto');
  else if (p.showLabels) { ctx.fillStyle = T['scene-ink']; ctx.font = `11px ${T.body}`; ctx.fillText('luz de una estrella lejana (ángulo ' + U.fmt(p.alpha, 3) + '°) →', 26, h - 40); }
  if (p.showImages) {
    if (Number.isFinite(sys.x1) && Number.isFinite(sys.h1)) arrowV(sys.x1, sys.h1, T.c3, !sys.real1, sys.single ? 'imagen (' + (sys.real1 ? 'real' : 'virtual') + ')' : 'imagen intermedia (' + (sys.real1 ? 'real' : 'virtual') + ')');
    if (!sys.single && Number.isFinite(sys.x2) && Number.isFinite(sys.h2)) arrowV(sys.x2, sys.h2, T.c5, !sys.real2, 'imagen final (' + (sys.real2 ? 'real' : 'virtual') + ')');
    if (!sys.single && p.objInf && fin.inf && p.showLabels) { ctx.fillStyle = T['scene-ink']; ctx.font = `11px ${T.body}`; ctx.textAlign = 'right'; ctx.fillText('imagen final en el infinito: haz colimado', w - 8, 18); ctx.textAlign = 'left'; }
  }
  const bar = Math.pow(10, Math.floor(Math.log10((xmax - xmin) / 5)));
  ctx.strokeStyle = T['scene-ink']; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(20, h - 16); ctx.lineTo(20 + bar * sx, h - 16); ctx.stroke();
  ctx.fillStyle = T['scene-ink']; ctx.font = `11px ${T.mono}`; ctx.fillText(U.fmt(bar) + ' mm (horizontal)', 20, h - 22);
  exp.ovTL.innerHTML = `escala vertical ×${U.fmt(ky, 3)}${ky > 1.001 ? ' (exagerada)' : ''}`;
  exp.ovBR.innerHTML = 'trazo continuo: rayo real · discontinuo: prolongación virtual<br>negro: rayos principales · ✕: rayo recortado por una abertura';
};

exp.drawCharts = function () {
  const p = exp.p, sys = exp.sys; if (!p) return;
  if (!sys || !sys.valid) { [exp.cImg, exp.cImg2, exp.cM, exp.cFoc, exp.cFoc2, exp.cChr].forEach(c => c.set([], { empty: 'Sin solución válida' })); return; }
  const f = sys.f1, xs = [], ys = [], ms = [];
  const lo = Math.abs(f) * 0.1, hi = Math.abs(f) * 6;
  for (let k = 0; k <= 300; k++) { const d = lo + (hi - lo) * k / 300; const im = F.image(f, d); xs.push(d); const di = im.inf || Math.abs(im.di) > 20 * Math.abs(f) ? NaN : im.di; ys.push(di); ms.push(Number.isFinite(di) ? -di / d : NaN); }
  const cur = p.objInf ? [] : [{ label: 'actual', x: [p.dObj], y: [sys.i1.di], color: 'ink', points: true }];
  const ser = [{ label: 'd_i(d_o), f = ' + U.fmt(f, 4) + ' mm', x: xs, y: ys, color: 'c1' }, { label: 'd_i = f', x: [lo, hi], y: [f, f], color: 'c3', dash: [4, 4] }].concat(cur);
  exp.cImg.set(ser); exp.cImg2.set(ser);
  exp.cM.set([{ label: 'm', x: xs, y: ms, color: 'c2' }].concat(p.objInf ? [] : [{ label: 'actual', x: [p.dObj], y: [sys.i1.m], color: 'ink', points: true }]));
  if (!sys.single) {
    const dx = [], dv = [];
    for (let k = -40; k <= 40; k++) { const d = k * 0.25; const pp = Object.assign({}, p, { L: Math.max(1, sys.f1 + sys.f2 + d) }); const s = F.system(pp); if (!s.valid) continue; const rs = F.fan(pp, s, 9, -Math.max(60, Math.abs(s.f1) * 0.25)).filter(r => r.blocked < 0).map(r => r.u); dx.push(d); dv.push(rs.length > 1 ? (Math.atan(Math.max(...rs)) - Math.atan(Math.min(...rs))) / U.deg * 60 : NaN); }
    const fser = [{ label: 'divergencia', x: dx, y: dv, color: 'c2' }, { label: 'actual', x: [sys.afocalErr], y: [exp.div], color: 'ink', points: true }];
    exp.cFoc.set(fser); exp.cFoc2.set(fser); exp.focCurve = { dx, dv };
  } else { exp.cFoc.set([], { empty: 'Solo en modo telescopio' }); exp.cFoc2.set([], { empty: 'Solo en modo telescopio' }); }
  if (p.mode1 === 'lensmaker') {
    const ls = [], fs = []; for (let l = 400; l <= 750; l += 5) { const r = F.focalFromParams(Object.assign({}, p, { dispersion: true }), l); ls.push(l); fs.push(r.valid ? r.f : NaN); }
    exp.cChr.set([{ label: 'f(λ)', x: ls, y: fs, color: 'c4' }]);
  } else exp.cChr.set([{ label: 'f(λ)', na: 'sin modelo de dispersión en el modo «distancia focal»' }], { empty: 'Active «Índice y curvaturas» y la dispersión' });
};
exp.onTab = () => setTimeout(() => { exp.draw(); exp.drawCharts(); }, 0);
exp.redraw = () => { exp.draw(); exp.drawCharts(); };
exp.exportCSV = function () {

/* ==== nbody.js ==== */
'use strict';
/* =====================================================================
   EXPERIMENTO 4 · NÚCLEO FÍSICO N-CUERPOS (sin interfaz)
   Unidades internas: parsec (pc), masa solar (M☉), millón de años (Myr).
     G = 4,300917×10⁻³ pc (km/s)² / M☉ × (1,0227122 pc/Myr por km/s)²
       = 4,49850×10⁻³ pc³ / (M☉ Myr²)
     Energía interna: M☉ pc²/Myr²; se muestra también en M☉ (km/s)².
   Modelo principal: masas puntuales newtonianas (sin suavizado).
   Variante declarada: suavizado de Plummer ε > 0 (potencial −G m m'/√(r²+ε²)).
   Campo de marea (opcional): aceleración externa a_ext = T r con T
   simétrico y de traza nula, en un sistema ligado al centro de masa
   inicial (origen), sin la aceleración uniforme del conjunto; potencial
   por unidad de masa Φ_ext = −½ r·T r ; virial de marea W = Σ m r·T r.
   Identidad de Lagrange–Jacobi (sistema aislado + marea):
     ½ d²I/dt² = 2K + W_int + W_marea ,  con W_int = Σ m r·a_int = U si ε = 0.
   ===================================================================== */
(function () {
const U = LAB.U;
const NB = LAB.nbody = {};
NB.KMS = 1.0227121650537077;                 // 1 km/s en pc/Myr
NB.G = 4.300917270e-3 * NB.KMS * NB.KMS;     // pc³ M☉⁻¹ Myr⁻²
NB.E_TO_KMS2 = 1 / (NB.KMS * NB.KMS);        // M☉ pc²/Myr² → M☉ (km/s)²
NB.MODEL_VERSION = 'nbody-1.0';

/* ---------------------- tensor de marea ---------------------- */
/** Construye T = R diag(λ₁,λ₂,λ₃) Rᵀ, λ₃ = −λ₁−λ₂ (traza nula). Ángulos en grados: giro ψ en z y θ en y. */
NB.tidalTensor = function (l1, l2, yawDeg, pitchDeg) {
  const l3 = -l1 - l2;
  const ps = yawDeg * U.deg, th = pitchDeg * U.deg;
  const Rz = [[Math.cos(ps), -Math.sin(ps), 0], [Math.sin(ps), Math.cos(ps), 0], [0, 0, 1]];
  const Ry = [[Math.cos(th), 0, Math.sin(th)], [0, 1, 0], [-Math.sin(th), 0, Math.cos(th)]];

/** Resuelve la configuración en ajustes concretos de simulación. */
function resolve(cfg) {
  const integ = cfg.integrator === 'auto' ? (cfg.N <= 300 ? 'dp45' : 'leapfrog') : cfg.integrator;
  const force = cfg.force === 'auto' ? (cfg.N <= 300 ? 'direct' : 'bh') : cfg.force;
  return { integ, force };
}
function tideOf(cfg) {
  if (!cfg.tideOn) return { on: false, T: new Float64Array(9), eig: [0, 0, 0], axis: [1, 0, 0] };
  let tt;
  if (cfg.tideMode === 'custom') tt = NB.tidalTensor(cfg.lam1 * 1e-3, cfg.lam2 * 1e-3, cfg.yaw, cfg.pitch);
  else { const tau = NB.hostTide(cfg.Mhost, cfg.Rg); tt = NB.tidalTensor(2 * tau, -tau, 0, 0); }
  return { on: true, T: tt.T, eig: tt.eig, axis: tt.axis };
}
/** Radio de marea aproximado (cúmulo puntual): equilibrio G M / r² = λ_max r. */
function tidalRadius(M, eig) { const l = Math.max(...eig); return l > 0 ? Math.cbrt(NB.G * M / l) : Infinity; }

class Run {
  constructor(cfg, label, log) {

    this.integ = r.integ; this.force = r.force;
    this.sim = new NB.Sim(this.ic, { integrator: r.integ, dt: cfg.dtFrac * this.tcr, rtol: cfg.rtol, force: r.force, theta: cfg.theta, eps: cfg.eps, tide: { on: startTide, T: tide.T }, tcr: this.tcr, dpH0: this.tcr * 1e-3 });
    this.tEnd = cfg.duration * this.tcr;

    this.nextSample = this.sampleDt;
    this.series = {}; ['t', 'K', 'U', 'E', 'Eext', 'Wt', 'Q', 'Qt', 'Qcum', 'Qwin', 'rrms', 'rh', 'dE', 'res', 'resT', 'resW', 'I', 'dI', 'halfIdd', 'ratioCA', 'ratioBA', 'nCand', 'Qrem', 'minR', 'h', 'Lmag', 'cm'].forEach(k => { this.series[k] = []; });
    this.trail = []; this.checkpoints = []; this.warnings = [];
    this.status = 'ready';
    this.d0 = this.sim.diag(cfg.escR);
    this.E0 = this.d0.E;
    const scaleE = this.d0.K + Math.abs(this.d0.U);
    this.Eref = Math.abs(this.d0.E) >= 0.1 * scaleE ? Math.abs(this.d0.E) : scaleE;
    this.ErefNote = Math.abs(this.d0.E) >= 0.1 * scaleE ? '|E₀|' : 'K₀ + |U₀| (E₀ ≈ 0)';
    this.Qic = this.d0.Q;
    this.record(this.d0);
    this.saveCheckpoint('inicio');
    this.cur = this.d0;
    log && log.add('inicio', `${label}: N = ${this.ic.N}, M = ${U.fmt(this.ic.M, 5)} M☉, Q inicial = ${U.fmt(this.d0.Q, 4)}, t_cr = ${U.fmt(this.tcr, 4)} Myr, integrador ${this.integName()}, fuerzas ${this.forceName()}${cfg.eps > 0 ? ', VARIANTE suavizada ε = ' + cfg.eps + ' pc' : ''}${startTide ? ', marea activa' : ''}.`);
  }
  integName() { return this.sim.s.integrator === 'dp45' ? `Dormand–Prince 5(4), tol ${U.fmt(this.sim.s.rtol, 2)}` : `leapfrog, dt = ${U.fmt(this.sim.s.dt, 3)} Myr`; }
  forceName() { return this.sim.s.force === 'bh' ? `Barnes–Hut θ = ${this.sim.s.theta}` : 'directas'; }

  /** ¿Se ha llegado a tt? Leapfrog: el siguiente paso completo lo sobrepasaría (nunca se recorta el paso fijo). */

  sampleNow() {

  advance(T, budget) {

        const target = Math.min(T, this.nextSample, tideT);

/** Diagnóstico prudente basado en la ventana final. */
function classify(run, winTcr) {
  const S = run.series, n = S.t.length;
  if (n < 6) return { verdict: 'evidencia insuficiente', detail: 'Pocas muestras: deje avanzar la simulación.' };
  const tEndS = S.t[n - 1], W = (winTcr || 2) * run.tcr;
  if (tEndS < 1.5 * run.tcr) return { verdict: 'evidencia insuficiente', detail: `Solo ${U.fmt(tEndS / run.tcr, 3)} t_cr simulados; se necesitan al menos 1,5 t_cr para juzgar.` };
  let k0 = n - 1; while (k0 > 0 && tEndS - S.t[k0 - 1] <= W) k0--;
  const r0 = S.rh[k0], r1 = S.rh[n - 1], dr = (r1 - r0) / r0; // radio de media masa: robusto frente a estrellas lejanas del halo
  const qAvg = S.Qwin[n - 1];
  const d = run.cur, Eint = d.Eint, parts = [];
  let verdict;
  if (Eint > 0 && dr > 0.05) verdict = 'dispersión (energía interna positiva: sistema no ligado)';
  else if (Math.abs(qAvg - 1) <= 0.12 && Math.abs(dr) <= 0.1) verdict = 'compatible con equilibrio virial';
  else if (dr < -0.1) {
    verdict = 'contracción persistente (posible colapso en curso)';
  } else if (dr > 0.1) verdict = Eint < 0 ? 'expansión (sistema ligado)' : 'expansión';
  else verdict = 'evolución moderada: evidencia insuficiente para afirmar equilibrio';
  // contracción transitoria: mínimo de tamaño en el interior de la serie y recuperación posterior
  let kmin = 0; for (let k = 1; k < n; k++) if (S.rh[k] < S.rh[kmin]) kmin = k;
  if (kmin > 0 && kmin < n - 3 && S.rh[kmin] < 0.7 * S.rh[0] && S.rh[n - 1] > 1.2 * S.rh[kmin]) parts.push(`contracción transitoria con rebote: r_h mínimo ${U.fmt(S.rh[kmin], 3)} pc en t = ${U.fmt(S.t[kmin], 4)} Myr`);
  parts.push(`⟨Q⟩ en los últimos ${U.fmt(Math.min(W, tEndS) / run.tcr, 3)} t_cr = ${U.fmt(qAvg, 3)}; variación del radio de media masa en la ventana ${U.fmt(dr * 100, 3)} %`);
  if (d.nCand > 0) parts.push(`posibles escapes: ${d.nCand} candidatos (no se eliminan)`);
  return { verdict, detail: parts.join('; ') + '.' };
}

  if (s.eps === 0) acts.splice(3, 0, ['Usar la variante suavizada ε = 0,01 pc (otra física)', () => { exp.restoreRun(R); exp.panel.setValues({ eps: 0.01 }); exp.forEachRun(r => r.change('método', 'activación de la variante suavizada ε = 0,01 pc (cambia la física)', sim => { sim.s.eps = 0.01; })); exp.updateModelNotes(); exp.renderStatus(); exp.resume(); }]);
  exp.showAlert('bad', `Simulación ${R.label} pausada: no se puede mantener la precisión. ${why}${enc} El estado se conserva. Elija cómo continuar:`, acts);

exp.onOverload = function (R) {
  exp.running = false; exp.playBtn.textContent = 'Continuar'; exp.pausedFor = 'overload';
  exp.log.add('aviso', `${R.label}: un paso tardó ${U.fmt(R.sim.lastStepMs, 3)} ms; pausa por sobrecarga del navegador.`);
  exp.showAlert('warn', `El navegador está sobrecargado: un paso de integración tardó ${U.fmt(R.sim.lastStepMs, 3)} ms. El estado se conserva y la precisión no se ha modificado.`, [
    ['Continuar igualmente', () => { exp.forEachRun(r => { r.status = 'ready'; r.overloadOK = true; }); exp.pausedFor = null; exp.log.add('aviso', 'El usuario decidió continuar pese a la sobrecarga.'); exp.resume(); }],
    ['Cambiar a Barnes–Hut', () => { exp.forEachRun(r => { r.status = 'ready'; r.change('método', 'cambio a Barnes–Hut por rendimiento', sim => { sim.s.force = 'bh'; }); }); exp.panel.setValues({ force: 'bh' }); exp.pausedFor = null; exp.resume(); }],
    ['Reiniciar con la mitad de estrellas', () => { exp.panel.setValues({ N: Math.max(2, Math.round(exp.panel.values.N / 2)) }); exp.reset(); }]

};
exp.forEachRun = f => { [exp.A].concat(exp.B ? [exp.B] : []).forEach(f); };
exp.restoreRun = function () { exp.forEachRun(r => r.restoreLast()); exp.pausedFor = null; exp.alerts.replaceChildren(); };
exp.resume = function () { exp.pausedFor = null; exp.forEachRun(r => { r.status = 'ready'; }); exp.targetT = exp.A.sim.t; exp.running = true; exp.playBtn.textContent = 'Pausa'; exp.updateModelNotes(); };

/* ------------------------------ lecturas ------------------------------ */
exp.eConv = () => (exp.panel.values.eUnit === 'kms' ? NB.E_TO_KMS2 : 1);
exp.updateReadouts = function () {
  const A = exp.A; if (!A) return;
  const d = A.cur, go = exp.gOut, gv = exp.gVal, S = A.series, n = S.t.length - 1, ec = NB.E_TO_KMS2;
  go.set('t', U.fmt(A.sim.t, 5)); go.set('ttcr', U.fmt(A.sim.t / A.tcr, 4));
  go.set('dt', A.sim.s.integrator === 'leapfrog' ? U.fmt(A.sim.s.dt, 3) + ' (fijo)' : U.fmt(A.sim.lastH || A.sim.h, 3) + ' (adapt.)');
  go.set('K', U.fmt(d.K * ec, 5)); go.set('Up', U.fmt(d.U * ec, 5)); go.set('Eext', A.tideActive ? U.fmt(d.Eext * ec, 4) : 'no aplica'); go.set('E', U.fmt(d.E * ec, 6));
  go.set('Q', U.fmt(d.Q, 4)); go.set('Qw', U.fmt(S.Qwin[n], 4)); go.set('Qc', U.fmt(S.Qcum[n], 4));
  go.set('res', U.fmt(d.res / Math.abs(d.U), 3)); go.set('resT', A.tideActive ? U.fmt(d.resT / Math.abs(d.U), 3) : 'no aplica');
  go.set('I', U.fmt(d.I, 4)); go.set('rrms', U.fmt(d.rrms, 4)); go.set('rh', U.fmt(d.rh, 4)); go.set('cm', U.fmt(Math.hypot(d.rc[0], d.rc[1], d.rc[2]), 2));
  go.set('shape', `${U.fmt(d.axes[0], 3)} : ${U.fmt(d.axes[1], 3)} : ${U.fmt(d.axes[2], 3)} (${U.fmt(d.ratioCA, 3)})`);
  go.set('cand', String(d.nCand)); go.set('rem', d.rem ? `${d.rem.N}, ${U.fmt(d.rem.Q, 3)}` : (d.nCand ? 'todas candidatas' : 'igual al sistema'));
  go.set('rt', A.tide.on ? U.fmt(tidalRadius(A.ic.M, A.tide.eig), 4) : 'sin marea');
  gv.set('dE', U.fmt(Math.abs(S.dE[n]), 3)); gv.set('Eref', A.ErefNote); gv.set('nst', String(A.sim.nSteps)); gv.set('nfo', String(A.sim.nForce)); gv.set('nrej', A.sim.s.integrator === 'dp45' ? String(A.sim.nReject) : 'no aplica');
  gv.set('hmin', A.sim.s.integrator === 'dp45' && Number.isFinite(A.sim.hMinSeen) ? U.fmt(A.sim.hMinSeen / A.tcr, 2) : (A.sim.s.integrator === 'leapfrog' ? U.fmt(A.sim.s.dt / A.tcr, 2) + ' (fijo)' : '—'));
  gv.set('minR', Number.isFinite(d.minR) ? U.fmt(d.minR, 3) : (A.sim.s.force === 'bh' ? 'no disponible con Barnes–Hut' : '—'));
  const c = classify(A, exp.panel.values.qWin);
  exp.verdict.textContent = 'A: ' + c.verdict + '. ' + c.detail + (exp.B ? ` · B: ${classify(exp.B, exp.panel.values.qWin).verdict}.` : '');
  const msgs = [];
  const dEn = Math.abs(S.dE[n]);
  msgs.push(dEn < 1e-5 ? ['ok', `Energía conservada a ${U.fmt(dEn, 2)} (referencia ${A.ErefNote}).`] : dEn < A.cfg.eTol ? ['warn', `Error de energía ${U.fmt(dEn, 2)}, por debajo del umbral de pausa (${U.fmt(A.cfg.eTol, 2)}).`] : ['bad', `Error de energía ${U.fmt(dEn, 2)} por encima del umbral.`]);
  msgs.push(['info', `Q objetivo/inicial: Q obtenido en t = 0 = ${U.fmt(A.Qic, 4)}${A.cfg.velMode === 'targetQ' || A.cfg.rescaleQ ? ` (objetivo ${A.cfg.Qtarget})` : ''}. No se garantiza que la evolución posterior permanezca en equilibrio.`]);
  if (d.Eint > 0) msgs.push(['warn', 'Energía interna K + U > 0: el sistema en conjunto no está ligado.']);
  if (d.degenerate && exp.panel.values.showAxes) msgs.push(['warn', 'El cúmulo es casi esférico: la orientación de los ejes principales es numéricamente inestable.']);
  if (A.sim.s.force === 'bh') msgs.push(['info', `Barnes–Hut θ = ${A.sim.s.theta}: fuerzas aproximadas; el error de energía incluye el error del árbol.`]);
  if (exp.lagging) msgs.push(['info', 'El cálculo va más lento que la velocidad visual pedida; no se ha reducido la precisión.']);
  const off = exp.offscreen || 0; if (off) msgs.push(['info', `${off} estrellas fuera del área visible: salir de la pantalla no significa escapar del cúmulo.`]);
  if (A.warnings.length) msgs.push(['warn', 'Eventos de esta ejecución: ' + A.warnings.slice(-3).join(' · ')]);
  LAB.setMsgs(exp.msgs, msgs);
  exp.clock.textContent = `A: t = ${U.fmt(A.sim.t, 4)} Myr (${U.fmt(A.sim.t / A.tcr, 3)} / ${U.fmt(A.cfg.duration, 3)} t_cr)` + (exp.B ? ` · B: t = ${U.fmt(exp.B.sim.t, 4)} Myr` : '');
};

/* ------------------------------ visualización ------------------------------ */
exp.bindCamera = function (cv) {
  let drag = null; const pts = new Map();
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); drag = { x: e.clientX, y: e.clientY }; });
  cv.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (exp._pinch) exp.zoomBy(exp._pinch / d); exp._pinch = d; return; }
    if (exp.panel.values.viewMode !== '3d') return;
    exp.cam.yaw += (e.clientX - prev[0]) * 0.008; exp.cam.pitch = U.clamp(exp.cam.pitch + (e.clientY - prev[1]) * 0.008, -1.55, 1.55);
    exp.draw(); void drag;
  });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) exp._pinch = null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); exp.zoomBy(e.deltaY > 0 ? 1.12 : 1 / 1.12); }, { passive: false });
};
exp.zoomBy = function (f) { const p = exp.panel.values; const cur = p.autoZoom ? exp.lastZoom || p.zoom : p.zoom; exp.panel.setValues({ autoZoom: false, zoom: U.clamp(+(cur * f).toPrecision(4), 0.2, 500) }); exp.draw(); };
exp.project = function (mode) {
  const cy = Math.cos(exp.cam.yaw), sy = Math.sin(exp.cam.yaw), cp = Math.cos(exp.cam.pitch), sp = Math.sin(exp.cam.pitch);
  if (mode === 'xy') return (x, y, z) => [x, y];
  if (mode === 'xz') return (x, y, z) => [x, z];
  if (mode === 'yz') return (x, y, z) => [y, z];
  return (x, y, z) => { const X1 = cy * x + sy * y, Y1 = -sy * x + cy * y; return [X1, -sp * Y1 + cp * z]; };
};
exp.draw = function () {
  if (!exp.A) return;
  exp.drawRun(exp.A, exp.canvasA, exp.ovA, exp.ovA2);
  if (exp.B) exp.drawRun(exp.B, exp.canvasB, exp.ovB, exp.ovB2);
};
exp.drawRun = function (R, cv, ov, ov2) {
  if (!cv.isConnected || cv.clientWidth === 0) return;
  const { ctx, w, h } = LAB.fitCanvas(cv), T = LAB.theme(), p = exp.panel.values, d = R.cur, sim = R.sim;
  ctx.fillStyle = T['scene-bg']; ctx.fillRect(0, 0, w, h);
  const P = exp.project(p.viewMode);
  const field = p.autoZoom ? Math.max(0.2, 8 * (exp.A.cur.rh || 1)) : p.zoom; // misma escala para A y B
  if (R === exp.A) exp.lastZoom = field;
  const sc = Math.min(w, h) / field;
  const rc = d.rc;
  const toS = (x, y, z) => { const q = P(x - rc[0], y - rc[1], z - rc[2]); return [w / 2 + q[0] * sc, h / 2 - q[1] * sc]; };
  // ejes de referencia (tríada)
  const tri = (vx, vy, vz, lab) => { const q = P(vx, vy, vz); ctx.beginPath(); ctx.moveTo(40, h - 40); ctx.lineTo(40 + q[0] * 24, h - 40 - q[1] * 24); ctx.stroke(); ctx.fillText(lab, 42 + q[0] * 28, h - 40 - q[1] * 28); };
  ctx.strokeStyle = T['ink-3']; ctx.fillStyle = T['scene-ink']; ctx.lineWidth = 1.2; ctx.font = `10px ${T.mono}`;
  tri(1, 0, 0, 'x'); tri(0, 1, 0, 'y'); tri(0, 0, 1, 'z');
  // trazas
  const N = sim.N, x = sim.x;
  if (p.trails !== 'none' && R.trail.length > 1 && !(p.trails === 'full' && N > 400)) {
    const nT = p.trails === 'short' ? Math.min(25, R.trail.length) : R.trail.length;
    ctx.strokeStyle = T['star-a']; ctx.globalAlpha = 0.25; ctx.lineWidth = 0.8;
    const step = Math.max(1, Math.floor(N / 400));
    for (let i = 0; i < N; i += step) {
      ctx.beginPath();
      for (let k = R.trail.length - nT; k < R.trail.length; k++) { const tr = R.trail[k]; const s = toS(tr[3 * i], tr[3 * i + 1], tr[3 * i + 2]); if (k === R.trail.length - nT) ctx.moveTo(s[0], s[1]); else ctx.lineTo(s[0], s[1]); }
      const s = toS(x[3 * i], x[3 * i + 1], x[3 * i + 2]); ctx.lineTo(s[0], s[1]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // estrellas
  const mMean = sim.M / N; let off = 0;
  const cand = sim._cand;
  const vsc = p.showVec ? 0.15 * Math.min(w, h) / Math.max(1e-9, Math.sqrt(2 * d.K / sim.M) * 3) : 0;
  for (let i = 0; i < N; i++) {
    const s = toS(x[3 * i], x[3 * i + 1], x[3 * i + 2]);
    if (s[0] < 0 || s[0] > w || s[1] < 0 || s[1] > h) { off++; continue; }
    const r = Math.max(1, Math.min(6, 1.6 * Math.cbrt(sim.m[i] / mMean)));
    if (cand && cand[i]) { ctx.strokeStyle = T.bad; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(s[0], s[1], r + 2.5, 0, 7); ctx.stroke(); }
    ctx.fillStyle = T['star-a']; ctx.globalAlpha = .9; ctx.beginPath(); ctx.arc(s[0], s[1], r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    if (p.showVec) { const v = sim.v, vc = d.vc; const q = P(v[3 * i] - vc[0], v[3 * i + 1] - vc[1], v[3 * i + 2] - vc[2]); ctx.strokeStyle = T.c4; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(s[0] + q[0] * vsc, s[1] - q[1] * vsc); ctx.stroke(); }
  }
  if (R === exp.A) exp.offscreen = off;
  // CM, radio de media masa, radio de marea, ejes principales, eje de marea
  const c0 = [w / 2, h / 2];
  if (p.showCM) { ctx.strokeStyle = T.ink; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(c0[0] - 8, c0[1]); ctx.lineTo(c0[0] + 8, c0[1]); ctx.moveTo(c0[0], c0[1] - 8); ctx.lineTo(c0[0], c0[1] + 8); ctx.stroke(); }
  if (p.showRadius) { ctx.strokeStyle = T.data; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(c0[0], c0[1], d.rh * sc, 0, 7); ctx.stroke(); ctx.setLineDash([]); if (p.showData) { ctx.fillStyle = T.data; ctx.font = `11px ${T.mono}`; ctx.fillText('r_h', c0[0] + d.rh * sc * 0.72 + 3, c0[1] - d.rh * sc * 0.72 - 3); } }
  if (R.tide.on) {
    const rt = tidalRadius(R.ic.M, R.tide.eig);
    if (rt * sc < 4 * Math.max(w, h)) { ctx.strokeStyle = T.c5; ctx.setLineDash([2, 4]); ctx.beginPath(); ctx.arc(c0[0], c0[1], rt * sc, 0, 7); ctx.stroke(); ctx.setLineDash([]); if (p.showData) { ctx.fillStyle = T.c5; ctx.font = `11px ${T.mono}`; ctx.fillText('r_t (aprox.)', c0[0] + rt * sc * 0.7 + 3, c0[1] + rt * sc * 0.7 + 12); } }
    const ax = R.tide.axis, q = P(ax[0], ax[1], ax[2]), L = Math.min(w, h) * 0.42;
    ctx.strokeStyle = T.c5; ctx.lineWidth = 1.2; ctx.globalAlpha = R.tideActive ? 0.9 : 0.35;
    ctx.beginPath(); ctx.moveTo(c0[0] - q[0] * L, c0[1] + q[1] * L); ctx.lineTo(c0[0] + q[0] * L, c0[1] - q[1] * L); ctx.stroke(); ctx.globalAlpha = 1;
    if (p.showData) { ctx.fillStyle = T.c5; ctx.font = `10px ${T.body}`; ctx.fillText(R.tideActive ? 'eje de estiramiento de marea' : 'marea (aún inactiva)', c0[0] + q[0] * L + 4, c0[1] - q[1] * L); }
  }
  if (p.showAxes) {
    const cols = [T.c2, T.c1, T.c3], names = ['a', 'b', 'c'];
    d.eig.forEach((e, k) => { const q = P(...e.vec), L = d.axes[k] * sc * 1.5; ctx.strokeStyle = cols[k]; ctx.lineWidth = 2; ctx.setLineDash([[], [6, 3], [2, 3]][k]); ctx.beginPath(); ctx.moveTo(c0[0] - q[0] * L, c0[1] + q[1] * L); ctx.lineTo(c0[0] + q[0] * L, c0[1] - q[1] * L); ctx.stroke(); ctx.setLineDash([]); ctx.fillStyle = cols[k]; ctx.font = `11px ${T.mono}`; ctx.fillText(names[k], c0[0] + q[0] * L + 4, c0[1] - q[1] * L); });
  }
  // barra de escala
  const bar = Math.pow(10, Math.floor(Math.log10(field / 4)));
  ctx.strokeStyle = T['scene-ink']; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(w - 14 - bar * sc, 26); ctx.lineTo(w - 14, 26); ctx.stroke();
  ctx.fillStyle = T['scene-ink']; ctx.font = `11px ${T.mono}`; ctx.textAlign = 'right'; ctx.fillText(U.fmt(bar) + ' pc', w - 14, 20); ctx.textAlign = 'left';
  const S = R.series, n = S.t.length - 1;
  ov.innerHTML = p.showData ? `<b>${R.label}${R.desc ? ' · ' + U.esc(R.desc) : ''}</b><br>t = ${U.fmt(sim.t, 4)} Myr = ${U.fmt(sim.t / R.tcr, 3)} t_cr<br>N = ${N} · Q = ${U.fmt(d.Q, 3)} · ⟨Q⟩ = ${U.fmt(S.Qwin[n], 3)}<br>r_h = ${U.fmt(d.rh, 3)} pc · candidatos: ${d.nCand}` : `<b>${R.label}</b>`;
  ov2.innerHTML = `${p.viewMode === '3d' ? 'vista 3D ortográfica' : 'proyección ' + p.viewMode.toUpperCase()} · centrada en el CM<br>${off ? off + ' fuera de la vista · ' : ''}○ rojo = candidato a escape`;
};

/* ------------------------------ gráficas ------------------------------ */
exp.drawCharts = function (force) {
  if (!exp.A) return;
  if (!force && exp.currentTab !== 'lab' && exp.currentTab !== 'charts') return;
  const p = exp.panel.values, A = exp.A, B = exp.B, ec = exp.eConv(), cs = exp.charts;
  const tf = p.tUnit === 'tcr' ? 1 / A.tcr : 1, tl = p.tUnit === 'tcr' ? 't [t_cr de A]' : 't [Myr]';
  const eu = p.eUnit === 'kms' ? 'M☉ (km/s)²' : 'M☉ pc²/Myr²';
  const tx = R => R.series.t.map(t => t * tf);
  const mul = (a, k) => a.map(v => v * k);
  const two = (R, key, label, color, dash, k) => { const out = [{ label: label + (B ? ' (A)' : ''), x: tx(R), y: k ? mul(R.series[key], k) : R.series[key], color, dash: dash || [] }]; if (B) out.push({ label: label + ' (B)', x: tx(B), y: k ? mul(B.series[key], k) : B.series[key], color, dash: [6, 4], width: 1.2 }); return out; };
  let xr = null; const a = parseFloat(exp.rangeMin.value), b = parseFloat(exp.rangeMax.value);
  if (Number.isFinite(a) || Number.isFinite(b)) xr = [Number.isFinite(a) ? a : 0, Number.isFinite(b) ? b : Math.max(...tx(A), 1e-9)];
  const tideNA = A.tideAt === Infinity && !(B && B.tideAt < Infinity) ? 'sin marea' : null;
  const eSeries = two(A, 'K', 'K', 'c4', [], ec).concat(two(A, 'U', 'U', 'c3', [2, 3], ec), two(A, 'E', 'E total', 'c2', [], ec));
  if (!tideNA) eSeries.push({ label: 'E_ext (A)', x: tx(A), y: mul(A.series.Eext, ec), color: 'c5', dash: [8, 3] });
  const qS = two(A, 'Q', 'Q', 'c1', []).concat(two(A, 'Qwin', '⟨Q⟩ ventana', 'c2', [6, 2]), [{ label: '⟨Q⟩ desde 0 (A)', x: tx(A), y: A.series.Qcum, color: 'c3', dash: [2, 3] }, { label: 'Q = 1', x: [0, Math.max(A.sim.t * tf, 1e-9)], y: [1, 1], color: 'ink-3', dash: [3, 3], width: 1 }]);
  cs.sE.set(eSeries, { xLabel: tl, yLabel: 'E [' + eu + ']', xRange: null });
  cs.sQ.set(qS, { xLabel: tl, yLabel: 'Q', xRange: null });
  if (exp.currentTab !== 'charts' && !force) return;
  cs.E.set(eSeries, { xLabel: tl, yLabel: 'E [' + eu + ']', xRange: xr });
  cs.Q.set(qS, { xLabel: tl, yLabel: 'Q', xRange: xr });
  const rS = two(A, 'rrms', 'r_rms', 'c1', []).concat(two(A, 'rh', 'r_h', 'c2', [5, 3]));
  if (A.tide.on) { const rt = tidalRadius(A.ic.M, A.tide.eig); rS.push({ label: 'r_t aprox. (A)', x: [0, A.tEnd * tf], y: [rt, rt], color: 'c5', dash: [2, 4] }); }
  cs.R.set(rS, { xLabel: tl, yLabel: 'radio [pc]', xRange: xr, yZero: true });
  cs.dE.set(two(A, 'dE', '|ΔE|/E_ref', 'c2', []), { xLabel: tl, yLabel: '|ΔE| / ' + A.ErefNote, xRange: xr });
  const norm = (R, key) => R.series[key].map((v, i) => v / Math.abs(R.series.U[i]));
  const resS = [{ label: '(2K+U)/|U| (A)', x: tx(A), y: norm(A, 'res'), color: 'c1' }, { label: '½Ï/|U| numérico (A)', x: tx(A), y: norm(A, 'halfIdd'), color: 'c2', dash: [2, 3], points: A.series.t.length < 60 }];
  if (!tideNA) resS.push({ label: '(2K+U+W)/|U| (A)', x: tx(A), y: norm(A, 'resT'), color: 'c5', dash: [6, 3] });
  if (A.sim.s.eps > 0) resS.push({ label: '(2K+W_int+W)/|U| (A)', x: tx(A), y: norm(A, 'resW'), color: 'c3', dash: [8, 3] });
  if (B) resS.push({ label: '(2K+U)/|U| (B)', x: tx(B), y: norm(B, 'res'), color: 'c1', dash: [6, 4], width: 1.2 });
  cs.res.set(resS, { xLabel: tl, yLabel: 'normalizado por |U|', xRange: xr });
  cs.I.set(two(A, 'I', 'I', 'c4', []), { xLabel: tl, yLabel: 'I [M☉ pc²]', xRange: xr, yZero: true });
  cs.tide.set(two(A, 'ratioBA', 'b/a', 'c1', []).concat(two(A, 'ratioCA', 'c/a', 'c2', [5, 3])), { xLabel: tl, yLabel: 'razón de ejes', xRange: xr });
  cs.tideW.set(tideNA ? [{ label: 'W_marea', na: 'sin campo de marea' }] : [{ label: 'W_marea (A)', x: tx(A), y: mul(A.series.Wt, ec), color: 'c5' }, { label: 'E_ext (A)', x: tx(A), y: mul(A.series.Eext, ec), color: 'c3', dash: [5, 3] }], { xLabel: tl, yLabel: 'E [' + eu + ']', xRange: xr, empty: 'Active el campo de marea para ver estos diagnósticos' });
  cs.cand.set(two(A, 'nCand', 'candidatos', 'c5', []).concat([{ label: 'Q remanente (A)', x: tx(A), y: A.series.Qrem, color: 'c1', dash: [5, 3] }]), { xLabel: tl, yLabel: 'número · Q', xRange: xr, yZero: true });
  cs.h.set(two(A, 'h', 'paso', 'c3', []), { xLabel: tl, yLabel: 'dt [Myr]', xRange: xr });
};
exp.onTab = k => { setTimeout(() => { exp.draw(); exp.drawCharts(true); if (k === 'charts') [exp.mE, exp.mD, exp.mB].forEach(c => c.draw()); }, 0); };
