<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio Astrofísico</title>
<meta name="description" content="Laboratorio interactivo de astronomía y física: estrellas binarias, telescopios reflector y refractor, y teorema del virial en cúmulos estelares. Funciona sin conexión.">
<style>
/* Disposición: barra superior fija + laboratorio en tres columnas (controles | escena | resultados) que se apilan en pantallas estrechas. */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --surface-2: #e4eaf1;
  --surface-3: #d6dee9;
  --ink: #132033;
  --ink-2: #48586f;
  --ink-3: #6d7c92;
  --line: #c9d3e0;
  --accent: #a85b07;        /* luz estelar (ámbar) */
  --accent-ink: #ffffff;
  --data: #1d6b89;          /* datos / magnitudes calculadas */
  --good: #1f7a46;
  --warn: #8f6200;
  --bad: #b3261e;
  --c1: #1d6b89; --c2: #b8560c; --c3: #6b4fb3; --c4: #2a7d4f; --c5: #a3306a; --c6: #5b6779;
  --scene-bg: #f7f9fc;
  --scene-ink: #233247;
  --star-a: #c26a00; --star-b: #2a6fb0;
  --ray: #c9471f; --ray-2: #1b72a8; --ray-3: #2f8a3e;
  --glass: rgba(80,140,200,.22);
  --mirror: #51637d;
  --font-display: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --r: 6px;
  --shadow: 0 1px 2px rgba(19,32,51,.08), 0 4px 14px rgba(19,32,51,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b111a; --surface: #111a26; --surface-2: #172233; --surface-3: #1f2c40;
    --ink: #e2e8f1; --ink-2: #a3b0c3; --ink-3: #7d8ba0; --line: #26344a;
    --accent: #f0b456; --accent-ink: #1a1203; --data: #63c1e0;
    --good: #5cc98a; --warn: #e6b545; --bad: #ff7b70;
    --c1: #63c1e0; --c2: #f0a057; --c3: #b39cf2; --c4: #6fd398; --c5: #f07fb6; --c6: #9aa7ba;
    --scene-bg: #070c14; --scene-ink: #c8d3e3;
    --star-a: #ffc469; --star-b: #8cc4ff;
    --ray: #ff8a5c; --ray-2: #6cc4ff; --ray-3: #7ddc85;
    --glass: rgba(120,180,240,.20); --mirror: #9fb1ca;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b111a; --surface: #111a26; --surface-2: #172233; --surface-3: #1f2c40;
  --ink: #e2e8f1; --ink-2: #a3b0c3; --ink-3: #7d8ba0; --line: #26344a;
  --accent: #f0b456; --accent-ink: #1a1203; --data: #63c1e0;
  --good: #5cc98a; --warn: #e6b545; --bad: #ff7b70;
  --c1: #63c1e0; --c2: #f0a057; --c3: #b39cf2; --c4: #6fd398; --c5: #f07fb6; --c6: #9aa7ba;
  --scene-bg: #070c14; --scene-ink: #c8d3e3;
  --star-a: #ffc469; --star-b: #8cc4ff;
  --ray: #ff8a5c; --ray-2: #6cc4ff; --ray-3: #7ddc85;
  --glass: rgba(120,180,240,.20); --mirror: #9fb1ca;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 1.55rem; }
h3 { font-size: 1.12rem; }
h4 { font-size: .98rem; }
p { margin: 0; }
.num, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: .86em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- barra superior ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 8px; background: none; border: 0; padding: 4px 0; cursor: pointer; }
.brand b { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: .01em; }
.brand span { color: var(--ink-3); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
.labnav { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; min-width: 0; }
@media (max-width: 700px) { .labnav { flex-wrap: nowrap; overflow-x: auto; order: 3; flex-basis: 100%; } .labnav button { white-space: nowrap; } }
.labnav button {
  border: 1px solid transparent; background: none; padding: 5px 10px; border-radius: var(--r); cursor: pointer; color: var(--ink-2);
}
.labnav button:hover { background: var(--surface-2); color: var(--ink); }
.labnav button[aria-current="page"] { border-color: var(--line); background: var(--surface-2); color: var(--ink); font-weight: 600; }
.labnav .k { font-family: var(--font-mono); color: var(--accent); margin-right: 4px; }

/* ---------- botones y controles ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 6px 11px; border-radius: var(--r); cursor: pointer; line-height: 1.2; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: none; border-color: transparent; }
.btn.small { padding: 3px 8px; font-size: .85rem; }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
select, input[type="number"], input[type="text"], textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; min-width: 0;
}
textarea { width: 100%; font-family: var(--font-mono); font-size: .82rem; }
input[type="range"] { width: 100%; accent-color: var(--accent); min-width: 0; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--accent); }

/* ---------- inicio ---------- */
.home { max-width: 1180px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 26px; }
.home-intro { display: grid; gap: 10px; max-width: 70ch; }
.home-intro h1 { font-size: clamp(1.7rem, 3.6vw, 2.5rem); }
.home-intro .eyebrow { font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.card {
  display: grid; grid-template-rows: auto 1fr auto; gap: 10px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; cursor: pointer; box-shadow: var(--shadow);
}
.card:hover { border-color: var(--accent); }
.card canvas { width: 100%; height: 140px; border-radius: 6px; background: var(--scene-bg); display: block; }
.card .k { font-family: var(--font-mono); color: var(--accent); font-size: .8rem; letter-spacing: .06em; }
.card h3 { margin-top: 2px; }
.card p { color: var(--ink-2); font-size: .92rem; }
.card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: .74rem; border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; color: var(--ink-2); }
.home-notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.home-notes div { border-top: 2px solid var(--line); padding-top: 10px; color: var(--ink-2); font-size: .9rem; }
.home-notes b { color: var(--ink); display: block; margin-bottom: 2px; }

/* ---------- laboratorio ---------- */
.lab { padding-block: 14px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; max-width: 1680px; margin: 0 auto; }
.lab-head { display: grid; gap: 8px; }
.lab-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.lab-title .k { font-family: var(--font-mono); color: var(--accent); }
.lab-lede { color: var(--ink-2); max-width: 90ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: .76rem; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); }
.chip .g { font-family: var(--font-mono); font-weight: 700; }
.st-pass { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.st-review { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.st-fail { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.st-none { color: var(--ink-3); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 7px 12px; cursor: pointer; color: var(--ink-2); white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

.lab-grid { display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
@media (max-width: 1250px) { .lab-grid { grid-template-columns: 290px minmax(0, 1fr); } .lab-grid .readouts { grid-column: 1 / -1; } }
@media (max-width: 820px) { .lab-grid { grid-template-columns: minmax(0, 1fr); } .lab-grid > * { grid-column: 1 / -1; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-width: 0; }
.controls { display: grid; gap: 10px; max-height: calc(100vh - 150px); overflow: auto; position: sticky; top: 64px; }
@media (max-width: 820px) { .controls { max-height: none; position: static; } }
.stage { display: grid; gap: 10px; min-width: 0; }
.viewport { position: relative; background: var(--scene-bg); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.viewport canvas { display: block; width: 100%; height: clamp(300px, 58vh, 640px); touch-action: none; }
.viewport .overlay-tl, .viewport .overlay-tr, .viewport .overlay-bl, .viewport .overlay-br { position: absolute; font-size: .78rem; color: var(--scene-ink); pointer-events: none; padding: 6px 9px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.overlay-tl { top: 0; left: 0; } .overlay-tr { top: 0; right: 0; text-align: right; } .overlay-bl { bottom: 0; left: 0; } .overlay-br { bottom: 0; right: 0; text-align: right; }
.viewport .vbtns { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; pointer-events: auto; }
.playbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.playbar .clock { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink-2); margin-left: auto; font-size: .86rem; }
.chart-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
.chart-box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 4px; min-width: 0; display: grid; gap: 4px; }
.chart-box .chart-head { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.chart-box .chart-head b { font-size: .86rem; font-weight: 600; }
.chart-box canvas { width: 100%; height: 200px; display: block; }
.chart-box.tall canvas { height: 260px; }
.chart-note { font-size: .76rem; color: var(--ink-3); }

/* grupos de parámetros */
.pgroup { display: grid; gap: 7px; }
.pgroup > summary { cursor: pointer; font-weight: 600; font-size: .9rem; list-style: none; display: flex; align-items: center; gap: 6px; }
.pgroup > summary::before { content: "▸"; color: var(--ink-3); font-size: .8em; }
.pgroup[open] > summary::before { content: "▾"; }
.pgroup > summary::-webkit-details-marker { display: none; }
.prow { display: grid; gap: 2px; }
.prow .plabel { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--ink-2); }
.prow .plabel .u { color: var(--ink-3); font-size: .8rem; }
.prow .pinputs { display: grid; grid-template-columns: minmax(0, 1fr) 92px; gap: 8px; align-items: center; }
.prow .pinputs input[type="number"] { width: 100%; font-family: var(--font-mono); font-size: .85rem; text-align: right; }
.prow.check { display: flex; align-items: center; gap: 6px; font-size: .86rem; }
.prow.check label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.prow select { width: 100%; }
.prow.disabled { opacity: .45; }
.prow .pmsg { font-size: .74rem; color: var(--warn); }
.help { border: 1px solid var(--line); background: var(--surface-2); border-radius: 50%; width: 17px; height: 17px; display: inline-grid; place-items: center; font-size: .68rem; cursor: pointer; color: var(--ink-2); padding: 0; flex: none; }
.help:hover { color: var(--ink); border-color: var(--ink-3); }
.helptext { font-size: .8rem; color: var(--ink-2); background: var(--surface-2); border-radius: 5px; padding: 6px 8px; }

/* paneles de resultados */
.readouts { display: grid; gap: 10px; }
.rgroup { display: grid; gap: 4px; }
.rgroup h4 { display: flex; align-items: center; gap: 8px; font-family: var(--font-body); font-size: .8rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); }
.kind { font-family: var(--font-mono); font-size: .68rem; letter-spacing: .04em; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); text-transform: none; }
.kind.in { color: var(--ink-2); }
.kind.out { color: var(--data); border-color: color-mix(in srgb, var(--data) 50%, var(--line)); }
.kind.model { color: var(--c3); border-color: color-mix(in srgb, var(--c3) 50%, var(--line)); }
.kind.val { color: var(--good); border-color: color-mix(in srgb, var(--good) 50%, var(--line)); }
.rrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: .86rem; padding: 2px 0; border-bottom: 1px dashed color-mix(in srgb, var(--line) 70%, transparent); }
.rrow:last-child { border-bottom: 0; }
.rrow .rl { color: var(--ink-2); min-width: 0; }
.rrow .rv { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--data); }
.rrow .rv .u { color: var(--ink-3); margin-left: 3px; font-size: .9em; }
.notes { display: grid; gap: 5px; font-size: .82rem; color: var(--ink-2); margin: 0; padding-left: 16px; }
.msgs { display: grid; gap: 6px; }
.msg { font-size: .83rem; padding: 6px 8px 6px 28px; border-radius: 5px; position: relative; background: var(--surface-2); border: 1px solid var(--line); }
.msg::before { position: absolute; left: 8px; top: 5px; font-family: var(--font-mono); font-weight: 700; }
.msg.ok::before { content: "✓"; color: var(--good); }
.msg.warn::before { content: "!"; color: var(--warn); }
.msg.bad::before { content: "✕"; color: var(--bad); }
.msg.info::before { content: "i"; color: var(--data); }
.msg.ok { border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.msg.warn { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); }
.msg.bad { border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.verdict { font-weight: 600; }

/* gráficas y pruebas a pantalla completa */
.wide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 12px; }
@media (max-width: 480px) { .wide-grid { grid-template-columns: minmax(0, 1fr); } }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .86rem; }
.toolbar label { display: inline-flex; gap: 5px; align-items: center; }
.toolbar input[type="number"] { width: 90px; }
.table-wrap { overflow-x: auto; }
table.tests { border-collapse: collapse; width: 100%; font-size: .84rem; }
table.tests th, table.tests td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.tests th { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
table.tests td.detail { color: var(--ink-2); max-width: 60ch; }
table.tests tr.level td { background: var(--surface-2); font-weight: 600; }
.badge { display: inline-flex; gap: 4px; align-items: center; font-size: .76rem; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; }
.log { font-family: var(--font-mono); font-size: .8rem; display: grid; gap: 3px; max-height: 60vh; overflow: auto; }
.log .ev { display: grid; grid-template-columns: 120px 110px minmax(0, 1fr); gap: 8px; border-bottom: 1px dashed var(--line); padding: 3px 0; }
@media (max-width: 600px) { .log .ev { grid-template-columns: minmax(0, 1fr); } }
.log .ev .t { color: var(--ink-3); }
.log .ev .k { color: var(--accent); }

/* guía */
.guide { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .guide { grid-template-columns: minmax(0, 1fr); } }
.guide .panel { display: grid; gap: 9px; }
.guide p, .guide li { max-width: 72ch; }
.guide ol, .guide ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.qcard { border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; display: grid; gap: 7px; background: var(--surface-2); }
.qcard .opts { display: grid; gap: 4px; }
.qcard .opts label { display: flex; gap: 7px; align-items: flex-start; cursor: pointer; font-size: .9rem; }
.qcard .reveal { border-left: 3px solid var(--data); padding-left: 9px; font-size: .9rem; }
.eq { font-family: var(--font-mono); background: var(--surface-2); padding: 6px 9px; border-radius: 5px; overflow-x: auto; white-space: nowrap; font-size: .86rem; }
details.explain { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
details.explain > summary { cursor: pointer; padding: 7px 10px; font-weight: 600; font-size: .88rem; }
details.explain > div { padding: 0 10px 10px; display: grid; gap: 6px; font-size: .88rem; color: var(--ink-2); }

/* modal y avisos */
.modal-back { position: fixed; inset: 0; background: rgba(5,10,18,.55); z-index: 50; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; width: min(760px, 100%); max-height: 88vh; overflow: auto; padding: 16px; display: grid; gap: 10px; box-shadow: var(--shadow); }
.modal.wide { width: min(1000px, 100%); }
.modal header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.toasts { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 60; display: grid; gap: 6px; max-width: min(420px, calc(100vw - 24px)); }
.toast { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; box-shadow: var(--shadow); font-size: .86rem; }
.alert-bar { border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--line)); background: color-mix(in srgb, var(--warn) 9%, var(--surface)); border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; }
.alert-bar.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }

/* informe imprimible */
.report { font-size: .92rem; display: grid; gap: 12px; }
.report h1 { font-size: 1.6rem; }
.report h2 { font-size: 1.25rem; margin-top: 8px; }
.report table { border-collapse: collapse; width: 100%; font-size: .84rem; }
.report td, .report th { border: 1px solid var(--line); padding: 4px 6px; text-align: left; }
.report img { max-width: 100%; border: 1px solid var(--line); border-radius: 4px; }
@media print {
  body > *:not(.modal-back) { display: none !important; }
  .modal-back { position: static; background: none; padding: 0; display: block; }
  .modal { max-height: none; overflow: visible; box-shadow: none; border: 0; width: 100%; }
  .modal .noprint { display: none !important; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

</style>
</head>
<body>
<header class="topbar">
  <button class="brand" id="homeBtn" type="button" aria-label="Inicio"><b>Laboratorio Astrofísico</b><span>óptica · gravitación</span></button>
  <nav class="labnav" id="labNav" aria-label="Experimentos"></nav>
  <button class="btn small" id="themeBtn" type="button">Tema: sistema</button>
</header>
<main>
  <section class="home" id="home" aria-label="Inicio"></section>
  <div id="labs"></div>
</main>
<div id="modalRoot"></div>
<div class="toasts" id="toastRoot" aria-live="polite"></div>
<noscript><p style="padding:16px">Esta aplicación necesita JavaScript activado.</p></noscript>

<script>
/* ==== core.js ==== */
'use strict';
/* =====================================================================
   NÚCLEO COMÚN
   Utilidades numéricas, generador aleatorio reproducible, formato de
   números en español, almacenamiento local, exportación/importación,
   gráficas propias (Canvas 2D), paneles de parámetros, registro de
   eventos y marco de pruebas con estados honestos.
   ===================================================================== */
(function () {
const LAB = window.LAB = window.LAB || {};
LAB.version = '1.2.0';
LAB.experiments = {};

/* ---------------------------- utilidades ---------------------------- */
const U = LAB.U = {};
U.clamp = (x, a, b) => Math.min(b, Math.max(a, x));
U.isNum = x => typeof x === 'number' && Number.isFinite(x);
const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
U.sup = n => String(n).split('').map(c => SUP[c] || c).join('');
function plain(x, sig) {
  // Cifras significativas con coma decimal y sin separador de miles (evita ambigüedad).
  let s = Number(x.toPrecision(sig)).toString();
  if (s.includes('e')) s = Number(s).toFixed(Math.max(0, sig - 1));
  return s.replace('.', ',').replace('-', '−');
}
/** Formatea un número para la interfaz (coma decimal, notación ×10ⁿ fuera de [1e-3, 1e6)). */
U.fmt = function (x, sig = 4) {
  if (x === null || x === undefined || Number.isNaN(x)) return '—';
  if (x === Infinity) return '∞';
  if (x === -Infinity) return '−∞';
  if (x === 0) return '0';
  const ax = Math.abs(x);
  if (ax >= 1e-3 && ax < 1e6) return plain(x, sig);
  let e = Math.floor(Math.log10(ax));
  let m = Number((x / Math.pow(10, e)).toPrecision(sig));
  if (Math.abs(m) >= 10) { m /= 10; e += 1; }
  return plain(m, sig) + '×10' + U.sup(e);
};
U.fmtFixed = (x, d = 2) => (U.isNum(x) ? x.toFixed(d).replace('.', ',').replace('-', '−') : '—');
U.mean = a => { let s = 0; for (const v of a) s += v; return a.length ? s / a.length : NaN; };
U.std = a => { const m = U.mean(a); let s = 0; for (const v of a) s += (v - m) ** 2; return a.length > 1 ? Math.sqrt(s / (a.length - 1)) : NaN; };
U.quantile = (a, q) => { if (!a.length) return NaN; const b = Array.from(a).sort((x, y) => x - y); const i = (b.length - 1) * q; const lo = Math.floor(i), hi = Math.ceil(i); return b[lo] + (b[hi] - b[lo]) * (i - lo); };
U.median = a => U.quantile(a, 0.5);
U.deg = Math.PI / 180;
U.ARCSEC_PER_RAD = 180 * 3600 / Math.PI; // 206264.806…
U.deepCopy = o => JSON.parse(JSON.stringify(o));
U.uid = () => Math.random().toString(36).slice(2, 9);
U.nowStamp = () => { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; };
U.sleep0 = () => new Promise(r => setTimeout(r, 0));
U.esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Generador pseudoaleatorio reproducible (mulberry32) + normal (Box–Muller). */
U.rng = function (seed) {
  let a = (seed >>> 0) || 1;
  const next = function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  let spare = null;
  next.gauss = function () {
    if (spare !== null) { const s = spare; spare = null; return s; }
    let u = 0, v = 0;
    while (u <= 1e-300) u = next();
    v = next();
    const r = Math.sqrt(-2 * Math.log(u));
    spare = r * Math.sin(2 * Math.PI * v);
    return r * Math.cos(2 * Math.PI * v);
  };
  return next;
};

/* ------------------------------ DOM ------------------------------ */
/** Crea un elemento: el('div.clase#id', {attr}, hijos...) */
const el = LAB.el = function (spec, attrs, ...kids) {
  const m = spec.match(/^([a-z0-9]+)?((?:[.#][\w-]+)*)$/i);
  const node = document.createElement((m && m[1]) || 'div');
  if (m && m[2]) for (const part of m[2].match(/[.#][\w-]+/g)) {
    if (part[0] === '.') node.classList.add(part.slice(1)); else node.id = part.slice(1);
  }
  if (attrs && (typeof attrs !== 'object' || attrs instanceof Node || Array.isArray(attrs))) { kids.unshift(attrs); attrs = null; }
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'text') node.textContent = v;
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return node;
};

/* Colores del tema leídos de las variables CSS (para dibujar en Canvas). */
let themeCache = null;
LAB.theme = function () {
  if (themeCache) return themeCache;
  const cs = getComputedStyle(document.documentElement);
  const names = ['bg', 'surface', 'surface-2', 'surface-3', 'ink', 'ink-2', 'ink-3', 'line', 'accent', 'data', 'good', 'warn', 'bad', 'c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'scene-bg', 'scene-ink', 'star-a', 'star-b', 'ray', 'ray-2', 'ray-3', 'glass', 'mirror'];
  const t = {};
  for (const n of names) t[n] = cs.getPropertyValue('--' + n).trim() || '#888';
  t.mono = cs.getPropertyValue('--font-mono').trim();
  t.body = cs.getPropertyValue('--font-body').trim();
  themeCache = t;
  return t;
};
LAB.invalidateTheme = () => { themeCache = null; };
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { themeCache = null; LAB.redrawAll && LAB.redrawAll(); }); } catch (e) { /* navegadores antiguos */ }

/** Ajusta un canvas a su tamaño CSS y a la densidad de píxeles. Devuelve {ctx,w,h}. */
LAB.fitCanvas = function (canvas) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(10, canvas.clientWidth), h = Math.max(10, canvas.clientHeight);
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  }
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.setLineDash([]); ctx.globalAlpha = 1;
  return { ctx, w, h };
};

/* ------------------------- almacenamiento ------------------------- */
const PREFIX = 'astrolab.v1.';
LAB.store = {
  get(key, fallback = null) { try { const s = localStorage.getItem(PREFIX + key); return s === null ? fallback : JSON.parse(s); } catch (e) { return fallback; } },
  set(key, val) { try { localStorage.setItem(PREFIX + key, JSON.stringify(val)); return true; } catch (e) { return false; } },
  del(key) { try { localStorage.removeItem(PREFIX + key); } catch (e) { /* sin almacenamiento */ } },
  available() { try { localStorage.setItem(PREFIX + '_t', '1'); localStorage.removeItem(PREFIX + '_t'); return true; } catch (e) { return false; } }
};

/* ------------------------- avisos y modales ------------------------- */
LAB.toast = function (text, ms = 3200) {
  const root = document.getElementById('toastRoot');
  if (!root) return;
  const t = el('div.toast', { role: 'status' }, text);
  root.append(t);
  setTimeout(() => t.remove(), ms);
};
LAB.modal = function (title, body, { wide = false, onClose } = {}) {
  const root = document.getElementById('modalRoot');
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  const closeBtn = el('button.btn.small.noprint', { type: 'button', onclick: close }, 'Cerrar');
  const box = el('div.modal' + (wide ? '.wide' : ''), { role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    el('header', el('h3', title), closeBtn), body);
  const back = el('div.modal-back', { onclick: e => { if (e.target === back) close(); } }, box);
  root.append(back);
  document.addEventListener('keydown', onKey);
  closeBtn.focus();
  return { close, box };
};

/* -------------------- exportación e importación -------------------- */
LAB.io = {
  /** Intenta descargar; además muestra el contenido para copiarlo (vistas incrustadas bloquean descargas). */
  exportText(filename, text, mime = 'application/json', title = 'Exportar') {
    const ta = el('textarea', { rows: 14, readonly: true, 'aria-label': 'Contenido exportado' });
    ta.value = text;
    const dl = () => {
      try {
        const blob = new Blob([text], { type: mime + ';charset=utf-8' });
        const a = el('a', { href: URL.createObjectURL(blob), download: filename });
        document.body.append(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
        LAB.toast('Descarga solicitada: ' + filename + '. Si no aparece, copie el contenido.');
      } catch (e) { LAB.toast('La descarga no está disponible aquí; copie el contenido.'); }
    };
    const copy = () => {
      const fallback = () => { ta.focus(); ta.select(); LAB.toast('Texto seleccionado: use Ctrl+C / Cmd+C.'); };
      try { navigator.clipboard.writeText(text).then(() => LAB.toast('Copiado al portapapeles.'), fallback); } catch (e) { fallback(); }
    };
    LAB.modal(title, el('div', { style: 'display:grid;gap:8px' },
      el('p.small.muted', `Archivo: ${filename} (${(text.length / 1024).toFixed(1).replace('.', ',')} kB). Si la descarga está bloqueada en esta vista, copie el texto y guárdelo con ese nombre.`),
      el('div.btn-row', el('button.btn.primary', { type: 'button', onclick: dl }, 'Descargar archivo'), el('button.btn', { type: 'button', onclick: copy }, 'Copiar')),
      ta));
  },
  /** Diálogo de importación: archivo o texto pegado. callback(text) debe lanzar error si no es válido. */
  importText(title, accept, callback) {
    const ta = el('textarea', { rows: 10, placeholder: 'Pegue aquí el contenido JSON…', 'aria-label': 'Contenido a importar' });
    const file = el('input', { type: 'file', accept });
    const msg = el('p.small');
    let m;
    const go = text => {
      try { callback(text); m.close(); LAB.toast('Configuración cargada.'); } catch (e) { msg.textContent = 'No se pudo cargar: ' + e.message; msg.style.color = 'var(--bad)'; }
    };
    file.addEventListener('change', () => { const f = file.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => go(String(r.result)); r.readAsText(f); });
    m = LAB.modal(title, el('div', { style: 'display:grid;gap:8px' }, el('label.small', 'Archivo: ', file), ta,
      el('div.btn-row', el('button.btn.primary', { type: 'button', onclick: () => go(ta.value) }, 'Cargar texto pegado')), msg));
  },
  toCSV(columns, rows) {
    const esc = v => (typeof v === 'number' ? (Number.isFinite(v) ? String(v) : '') : '"' + String(v).replace(/"/g, '""') + '"');
    return columns.map(esc).join(',') + '\n' + rows.map(r => r.map(esc).join(',')).join('\n') + '\n';
  }
};

/* -------------------------- registro de eventos -------------------------- */
class EventLog {
  constructor() { this.items = []; this.listeners = []; }
  add(kind, text, data) {
    const ev = { wall: U.nowStamp(), kind, text, data: data === undefined ? null : data };
    this.items.push(ev);
    if (this.items.length > 2000) this.items.shift();
    this.listeners.forEach(f => f(ev));
    return ev;
  }
  onAdd(f) { this.listeners.push(f); }
  clear() { this.items = []; this.listeners.forEach(f => f(null)); }
}
LAB.EventLog = EventLog;

/* ------------------------------- gráficas ------------------------------- */
function niceStep(range, count) {
  const raw = range / Math.max(1, count);
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}
function ticks(min, max, count) {
  if (!(max > min)) return [min];
  const st = niceStep(max - min, count);
  const out = [];
  for (let v = Math.ceil(min / st) * st; v <= max + st * 1e-9; v += st) out.push(Math.abs(v) < st * 1e-9 ? 0 : v);
  return out;
}
/**
 * Gráfica de líneas en Canvas 2D. Cada serie: {label, x:[], y:[], color:'c1', dash:[], na:'motivo'}.
 * Opciones: xLabel, yLabel, yLog (usa |y|, marca los valores no positivos como ausentes),
 * xRange:[min,max] (ventana temporal), yZero (incluir cero), empty (texto cuando no hay datos).
 */
class Chart {
  constructor(canvas, opts = {}) {
    this.canvas = canvas; this.opts = opts; this.series = []; this.hoverX = null;
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', opts.title || opts.yLabel || 'Gráfica');
    canvas.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); this.hoverX = e.clientX - r.left; this.draw(); });
    canvas.addEventListener('mouseleave', () => { this.hoverX = null; this.draw(); });
  }
  set(series, opts) { this.series = series || []; if (opts) Object.assign(this.opts, opts); this.draw(); }
  draw() {
    const c = this.canvas;
    if (!c.isConnected || c.clientWidth === 0) return;
    const { ctx, w, h } = LAB.fitCanvas(c);
    const T = LAB.theme(), o = this.opts;
    ctx.clearRect(0, 0, w, h);
    ctx.font = `11px ${T.body}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.setLineDash([]); ctx.globalAlpha = 1;
    const L = 60, R = 10, TOP = 8 + 16 * Math.ceil(this.series.length / Math.max(1, Math.floor((w - L) / 150))), B = 32;
    const pw = w - L - R, ph = h - TOP - B;
    if (pw < 40 || ph < 30) return;
    const yT = v => (o.yLog ? (v > 0 ? Math.log10(v) : NaN) : v);
    const yv = v => (o.yLog ? Math.abs(v) : v);
    // rangos
    let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity, any = false;
    for (const s of this.series) {
      if (s.na || !s.x) continue;
      for (let i = 0; i < s.x.length; i++) {
        const x = s.x[i]; if (!Number.isFinite(x)) continue;
        if (o.xRange && (x < o.xRange[0] || x > o.xRange[1])) continue;
        const y = yT(yv(s.y[i])); if (!Number.isFinite(y)) continue;
        any = true;
        if (x < xmin) xmin = x; if (x > xmax) xmax = x; if (y < ymin) ymin = y; if (y > ymax) ymax = y;
      }
    }
    if (o.xRange) { xmin = o.xRange[0]; xmax = o.xRange[1]; }
    ctx.strokeStyle = T.line; ctx.lineWidth = 1; ctx.strokeRect(L + .5, TOP + .5, pw, ph);
    // leyenda (con muestra de trazo: el color no es la única pista)
    ctx.textAlign = 'left';
    let lx = L, ly = 4;
    for (const s of this.series) {
      const col = T[s.color] || s.color || T.c1;
      const label = s.label + (s.na ? ' (' + s.na + ')' : '');
      const tw = ctx.measureText(label).width + 30;
      if (lx + tw > w - R && lx > L) { lx = L; ly += 16; }
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash(s.dash || []);
      ctx.beginPath(); ctx.moveTo(lx, ly + 7); ctx.lineTo(lx + 20, ly + 7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = s.na ? T['ink-3'] : T['ink-2']; ctx.textBaseline = 'middle'; ctx.fillText(label, lx + 24, ly + 7);
      lx += tw + 8;
    }
    if (!any) {
      ctx.fillStyle = T['ink-3']; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(o.empty || 'Sin datos todavía: inicie la simulación', L + pw / 2, TOP + ph / 2); ctx.textAlign = 'left';
      this._layout = null; return;
    }
    if (o.yZero && !o.yLog) { ymin = Math.min(ymin, 0); ymax = Math.max(ymax, 0); }
    if (ymax - ymin <= 1e-9 * Math.max(Math.abs(ymax), Math.abs(ymin))) { ymin = ymax = (ymax + ymin) / 2; }
    if (ymax === ymin) { const d = Math.abs(ymax) * 0.05 || (o.yLog ? 0.5 : 1); ymin -= d; ymax += d; }
    else { const pad = (ymax - ymin) * 0.06; ymin -= pad; ymax += pad; }
    if (xmax === xmin) { xmax = xmin + 1; }
    const X = x => L + (x - xmin) / (xmax - xmin) * pw;
    const Y = y => TOP + ph - (y - ymin) / (ymax - ymin) * ph;
    // rejilla y marcas
    ctx.fillStyle = T['ink-2']; ctx.strokeStyle = T.line; ctx.lineWidth = 1; ctx.globalAlpha = 1;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    const yt = o.yLog ? ticks(Math.floor(ymin), Math.ceil(ymax), 6).filter(v => Number.isInteger(Math.round(v * 1e6) / 1e6)) : ticks(ymin, ymax, 5);
    for (const v of yt) {
      if (v < ymin || v > ymax) continue;
      const py = Y(v);
      ctx.globalAlpha = .55; ctx.beginPath(); ctx.moveTo(L, py + .5); ctx.lineTo(L + pw, py + .5); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillText(o.yLog ? '10' + U.sup(Math.round(v)) : U.fmt(v, 3), L - 5, py);
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const v of ticks(xmin, xmax, Math.max(2, Math.floor(pw / 80)))) {
      const px = X(v);
      ctx.globalAlpha = .55; ctx.beginPath(); ctx.moveTo(px + .5, TOP); ctx.lineTo(px + .5, TOP + ph); ctx.stroke(); ctx.globalAlpha = 1;
      ctx.fillText(U.fmt(v, 3), px, TOP + ph + 4);
    }
    ctx.fillStyle = T['ink-2']; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
    ctx.fillText(o.xLabel || '', L + pw, h - 1);
    ctx.save(); ctx.translate(11, TOP + ph / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText((o.yLabel || '') + (o.yLog ? ' (escala log, |valor|)' : ''), 0, 0); ctx.restore();
    // cero
    if (!o.yLog && ymin < 0 && ymax > 0) { ctx.strokeStyle = T['ink-3']; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(L, Y(0)); ctx.lineTo(L + pw, Y(0)); ctx.stroke(); ctx.setLineDash([]); }
    // series
    ctx.save(); ctx.beginPath(); ctx.rect(L, TOP, pw, ph); ctx.clip();
    for (const s of this.series) {
      if (s.na || !s.x) continue;
      ctx.strokeStyle = T[s.color] || s.color || T.c1; ctx.lineWidth = s.width || 1.6; ctx.setLineDash(s.dash || []);
      ctx.beginPath(); let pen = false;
      const n = s.x.length, stride = Math.max(1, Math.floor(n / (pw * 2)));
      for (let i = 0; i < n; i += (i + stride < n ? stride : Math.max(1, n - 1 - i))) {
        const x = s.x[i], y = yT(yv(s.y[i]));
        if (!Number.isFinite(x) || !Number.isFinite(y) || (o.xRange && (x < xmin || x > xmax))) { pen = false; if (i === n - 1) break; continue; }
        const px = X(x), py = Y(y);
        if (pen) ctx.lineTo(px, py); else { ctx.moveTo(px, py); pen = true; }
        if (i === n - 1) break;
      }
      ctx.stroke(); ctx.setLineDash([]);
      if (s.points) { ctx.fillStyle = ctx.strokeStyle; for (let i = 0; i < n; i++) { const y = yT(yv(s.y[i])); if (Number.isFinite(y)) { ctx.beginPath(); ctx.arc(X(s.x[i]), Y(y), 2.5, 0, 7); ctx.fill(); } } }
    }
    ctx.restore();
    this._layout = { X, Y, xmin, xmax, L, pw, TOP, ph };
    // lectura bajo el cursor
    if (this.hoverX !== null && this.hoverX >= L && this.hoverX <= L + pw) {
      const xv = xmin + (this.hoverX - L) / pw * (xmax - xmin);
      ctx.strokeStyle = T['ink-3']; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(this.hoverX, TOP); ctx.lineTo(this.hoverX, TOP + ph); ctx.stroke(); ctx.setLineDash([]);
      const lines = [(o.xLabel || 'x') + ': ' + U.fmt(xv, 4)];
      for (const s of this.series) {
        if (s.na || !s.x || !s.x.length) continue;
        let lo = 0, hi = s.x.length - 1;
        while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (s.x[mid] < xv) lo = mid; else hi = mid; }
        const i = Math.abs(s.x[lo] - xv) < Math.abs(s.x[hi] - xv) ? lo : hi;
        lines.push(s.label + ': ' + U.fmt(s.y[i], 5));
      }
      ctx.font = `11px ${T.mono}`;
      const bw = Math.max(...lines.map(t => ctx.measureText(t).width)) + 12, bh = lines.length * 14 + 6;
      let bx = this.hoverX + 8; if (bx + bw > w - 2) bx = this.hoverX - bw - 8;
      ctx.fillStyle = T.surface; ctx.globalAlpha = .93; ctx.fillRect(bx, TOP + 4, bw, bh); ctx.globalAlpha = 1;
      ctx.strokeStyle = T.line; ctx.strokeRect(bx + .5, TOP + 4.5, bw, bh);
      ctx.fillStyle = T.ink; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      lines.forEach((t, k) => ctx.fillText(t, bx + 6, TOP + 8 + k * 14));
    }
  }
}
LAB.Chart = Chart;

/** Caja de gráfica con título y nota. Devuelve {box, chart}. */
LAB.chartBox = function (title, opts = {}, note) {
  const cv = el('canvas');

/* --------------------------- paneles de parámetros --------------------------- */
/**
 * Construye un panel de parámetros desde un esquema:
 * [{group, open, items:[{key, label, unit, type:'num'|'select'|'check', min, max, step, def, log, options:[[v,txt]], help, when:(vals)=>bool}]}]
 * El valor numérico se valida: fuera de rango se recorta y se informa.
 */
class ParamPanel {
  constructor(schema, onChange) {
    this.schema = schema; this.onChange = onChange; this.values = {}; this.rows = {};
    this.root = el('div', { style: 'display:grid;gap:10px' });
    for (const g of schema) {
      const det = el('details.pgroup', { open: g.open !== false });
      det.append(el('summary', g.group));
      for (const it of g.items) { this.values[it.key] = it.def; det.append(this._row(it)); }
      this.root.append(det);
    }
    this.refreshVisibility();
  }
  _row(it) {
    const helpBtn = it.help ? el('button.help', { type: 'button', title: 'Ayuda', 'aria-label': 'Ayuda sobre ' + it.label }, '?') : null;
    const helpTxt = it.help ? el('div.helptext', { hidden: true }, it.help) : null;
    if (helpBtn) helpBtn.addEventListener('click', () => { helpTxt.hidden = !helpTxt.hidden; });
    const id = 'p-' + U.uid();
    let row, setUI;
    if (it.type === 'check') {
      const cb = el('input', { type: 'checkbox', id });
      cb.checked = !!it.def;
      cb.addEventListener('change', () => this._set(it, cb.checked));
      row = el('div.prow.check', el('label', { for: id }, cb, it.label), helpBtn, helpTxt);
      setUI = v => { cb.checked = !!v; };
    } else if (it.type === 'select') {
      const sel = el('select', { id }, it.options.map(([v, t]) => el('option', { value: v }, t)));
      sel.value = it.def;
      sel.addEventListener('change', () => this._set(it, sel.value));
      row = el('div.prow', el('div.plabel', el('label', { for: id }, it.label), helpBtn), sel, helpTxt);
      setUI = v => { sel.value = v; };
    } else {
      const toS = v => (it.log ? Math.log10(v) : v), fromS = s => (it.log ? Math.pow(10, s) : s);
      const rng = el('input', { type: 'range', min: toS(it.min), max: toS(it.max), step: it.log ? 'any' : (it.step || 'any'), 'aria-label': it.label + ' (deslizador)' });
      const num = el('input', { type: 'number', id, min: it.min, max: it.max, step: it.step || 'any' });
      const msg = el('div.pmsg', { hidden: true });
      rng.addEventListener('input', () => { let v = fromS(parseFloat(rng.value)); v = it.step && !it.log ? Math.round(v / it.step) * it.step : Number(v.toPrecision(4)); num.value = v; this._set(it, v); });
      num.addEventListener('change', () => {
        let v = parseFloat(String(num.value).replace(',', '.'));
        if (!Number.isFinite(v)) { msg.hidden = false; msg.textContent = 'Valor no numérico: se mantiene ' + this.values[it.key]; num.value = this.values[it.key]; return; }
        if (v < it.min || v > it.max) { msg.hidden = false; msg.textContent = `Fuera del rango permitido [${it.min}, ${it.max}]: se ajustó.`; v = U.clamp(v, it.min, it.max); } else msg.hidden = true;
        num.value = v; rng.value = toS(v); this._set(it, v);
      });
      row = el('div.prow', el('div.plabel', el('label', { for: id }, it.label), it.unit ? el('span.u', '[' + it.unit + ']') : null, helpBtn), el('div.pinputs', rng, num), msg, helpTxt);
      setUI = v => { num.value = v; rng.value = toS(v); };
    }
    setUI(it.def);
    this.rows[it.key] = { row, setUI, it };
    return row;
  }
  _set(it, v) { this.values[it.key] = v; this.refreshVisibility(); this.onChange && this.onChange(it.key, v, this.values); }
  refreshVisibility() { for (const k in this.rows) { const r = this.rows[k]; if (r.it.when) r.row.hidden = !r.it.when(this.values); } }
  get(k) { return this.values[k]; }
  /** Asigna valores (sin disparar onChange para cada uno). Ignora claves desconocidas. */
  setValues(vals, silent = true) {
    for (const [k, v] of Object.entries(vals || {})) {
      const r = this.rows[k]; if (!r) continue;
      let val = v;
      if (r.it.type !== 'check' && r.it.type !== 'select') { val = Number(v); if (!Number.isFinite(val)) continue; val = U.clamp(val, r.it.min, r.it.max); }
      if (r.it.type === 'select' && !r.it.options.some(o => String(o[0]) === String(v))) continue;
      this.values[k] = val; r.setUI(val);
    }
    this.refreshVisibility();
    if (!silent && this.onChange) this.onChange(null, null, this.values);
  }
  defaults() { const d = {}; for (const g of this.schema) for (const it of g.items) d[it.key] = it.def; return d; }
  setDisabled(key, disabled, reason) { const r = this.rows[key]; if (!r) return; r.row.classList.toggle('disabled', !!disabled); r.row.querySelectorAll('input,select').forEach(i => { i.disabled = !!disabled; }); r.row.title = disabled ? (reason || '') : ''; }
}
LAB.ParamPanel = ParamPanel;

/* ------------------------------ pruebas ------------------------------ */
/*
 * Cada prueba devuelve {status:'pass'|'review'|'fail', detail, tol}. Estados mostrados:
 *  pass → «validado dentro de tolerancia», review → «requiere revisión»,
 *  fail → «prueba fallida», sin ejecutar → «no evaluado». Una excepción = fallo.
 */
const STATUS = { pass: 'validado dentro de tolerancia', review: 'requiere revisión', fail: 'prueba fallida', none: 'no evaluado' };
const GLYPH = { pass: '✓', review: '!', fail: '✕', none: '–' };
LAB.STATUS = STATUS; LAB.GLYPH = GLYPH;
const Tests = LAB.Tests = {
  list: [], results: {}, listeners: [],
  register(exp, level, id, name, fn, tol) { this.list.push({ exp, level, id: exp + '.' + id, name, fn, tol: tol || '' }); },
  forExp(exp) { return this.list.filter(t => t.exp === exp); },
  levels(exp) { return [...new Set(this.forExp(exp).map(t => t.level))]; },
  async run(filter, onProgress) {
    const sel = this.list.filter(filter);
    for (const t of sel) {
      const t0 = performance.now();
      let r;
      try { r = await t.fn(); if (!r || !STATUS[r.status]) r = { status: 'fail', detail: 'La prueba no devolvió un estado válido.' }; }
      catch (e) { r = { status: 'fail', detail: 'Excepción: ' + (e && e.message ? e.message : e) }; }
      r.ms = performance.now() - t0; r.at = U.nowStamp();
      this.results[t.id] = r;
      onProgress && onProgress(t, r);
      this.listeners.forEach(f => f(t, r));
      await U.sleep0();
    }
  },
  summary(exp, level) {
    const ts = this.forExp(exp).filter(t => !level || t.level === level);
    const c = { pass: 0, review: 0, fail: 0, none: 0, total: ts.length };
    for (const t of ts) { const r = this.results[t.id]; c[r ? r.status : 'none']++; }
    // Un nivel solo es «validado» si TODAS sus pruebas se ejecutaron y pasaron.
    c.status = c.fail ? 'fail' : c.review ? 'review' : c.none ? 'none' : 'pass';
    return c;
  },
  onResult(f) { this.listeners.push(f); },
  /** Resultado serializable para el informe. */
  dump(exp) {
    return this.forExp(exp).map(t => { const r = this.results[t.id]; return { id: t.id, nivel: t.level, nombre: t.name, tolerancia: t.tol, estado: r ? STATUS[r.status] : STATUS.none, detalle: r ? r.detail : '', ms: r ? Math.round(r.ms) : null, ejecutada: r ? r.at : null }; });
  }
};
/** Ayudante: compara |valor−ref| ≤ tol. */
LAB.near = (v, ref, tol) => Number.isFinite(v) && Math.abs(v - ref) <= tol;
LAB.res = (ok, detail, reviewIf) => ({ status: ok ? 'pass' : (reviewIf ? 'review' : 'fail'), detail });

/** Panel de pruebas de un experimento. */
LAB.testPanel = function (exp, intro) {
  const tbody = el('tbody');
  const progress = el('span.small.muted');
  const render = () => {
    tbody.replaceChildren();
    for (const level of Tests.levels(exp)) {
      const s = Tests.summary(exp, level);
      tbody.append(el('tr.level', el('td', { colspan: 5 }, level + ' — ', el('span.badge.st-' + s.status, GLYPH[s.status] + ' ' + STATUS[s.status]), ` (${s.pass} validadas, ${s.review} a revisar, ${s.fail} fallidas, ${s.none} sin evaluar)`)));
      for (const t of Tests.forExp(exp).filter(x => x.level === level)) {
        const r = Tests.results[t.id], st = r ? r.status : 'none';
        tbody.append(el('tr', el('td', t.name), el('td', el('span.badge.st-' + st, GLYPH[st] + ' ' + STATUS[st])), el('td.detail', r ? r.detail : '—'), el('td.small.muted', t.tol || '—'), el('td.num.small', r ? Math.round(r.ms) + ' ms' : '—')));
      }
    }
  };
  const runBtn = el('button.btn.primary', { type: 'button' }, 'Ejecutar todas las pruebas');
  const levelSel = el('select', { 'aria-label': 'Nivel de pruebas' }, el('option', { value: '' }, 'Todos los niveles'), Tests.levels(exp).map(l => el('option', { value: l }, l)));
  runBtn.addEventListener('click', async () => {
    runBtn.disabled = true; let k = 0;
    const lv = levelSel.value;
    const total = Tests.forExp(exp).filter(t => !lv || t.level === lv).length;
    await Tests.run(t => t.exp === exp && (!lv || t.level === lv), t => { k++; progress.textContent = `Ejecutada ${k}/${total}: ${t.name}`; render(); });
    progress.textContent = `Pruebas terminadas (${U.nowStamp()}).`;
    runBtn.disabled = false; render();
  });
  const exportBtn = el('button.btn', { type: 'button', onclick: () => LAB.io.exportText(`pruebas_${exp}.json`, JSON.stringify({ app: 'Laboratorio Astrofísico', version: LAB.version, experimento: exp, fecha: U.nowStamp(), navegador: navigator.userAgent, resultados: Tests.dump(exp) }, null, 2), 'application/json', 'Exportar resultados de pruebas') }, 'Exportar resultados (JSON)');
  Tests.onResult(t => { if (t.exp === exp) render(); });
  render();
  return el('div', { style: 'display:grid;gap:10px' },
    el('div.panel', { style: 'display:grid;gap:8px' }, intro ? el('p.small.muted', intro) : null,
      el('p.small.muted', 'Estados posibles: «validado dentro de tolerancia», «requiere revisión», «prueba fallida» y «no evaluado». Una prueba que no se ha ejecutado nunca aparece como superada. Las pruebas se ejecutan en este navegador con el mismo código que usa el laboratorio.'),
      el('div.btn-row', runBtn, levelSel, exportBtn, progress)),
    el('div.panel.table-wrap', el('table.tests', el('thead', el('tr', el('th', 'Prueba'), el('th', 'Estado'), el('th', 'Resultado observado'), el('th', 'Tolerancia'), el('th', 'Tiempo'))), tbody)));
};

/* --------------------------- guía pedagógica --------------------------- */
/**
 * Guía: objetivo, explicación, escenario de referencia, predicción previa,
 * preguntas (respuesta oculta hasta responder o pedirla), conclusión basada en datos y desafíos.
 */
LAB.guidePanel = function (exp, g) {
  const left = el('div.panel', el('h3', 'Objetivo de aprendizaje'), el('p', g.objective), el('h4', 'Explicación breve'), el('div', { html: g.intro }),
    g.refScenario ? el('div.btn-row', el('button.btn', { type: 'button', onclick: () => { exp.loadScenario(g.refScenario); exp.showTab('lab'); } }, 'Cargar escenario de referencia')) : null,
    g.equations ? el('details.explain', el('summary', 'Ecuaciones y convenciones del modelo'), el('div', { html: g.equations })) : null,
    g.limits ? el('details.explain', el('summary', 'Límites del modelo'), el('div', { html: g.limits })) : null);
  const right = el('div.panel', el('h3', 'Predecir, observar, explicar'));
  // predicción
  for (const q of g.questions) {
    const name = 'q' + U.uid();
    const reveal = el('div.reveal', { hidden: true, html: q.explain });
    const fb = el('div.small');
    const opts = el('div.opts', q.options.map((t, i) => el('label', el('input', { type: 'radio', name, value: i }), el('span', t))));
    const check = el('button.btn.small', { type: 'button' }, q.kind === 'predict' ? 'Registrar mi predicción' : 'Comprobar');
    const show = el('button.btn.small.ghost', { type: 'button' }, 'Ver explicación');
    check.addEventListener('click', () => {
      const s = opts.querySelector('input:checked');
      if (!s) { fb.textContent = 'Elija una opción primero.'; return; }
      const i = +s.value;
      opts.querySelectorAll('input').forEach(x => { x.disabled = true; });
      exp.log.add('guía', (q.kind === 'predict' ? 'Predicción registrada: ' : 'Respuesta: ') + q.options[i]);
      if (q.kind === 'predict') fb.textContent = 'Predicción registrada. ' + (q.after || 'Ejecute la simulación y compare con los resultados; luego abra la explicación.');
      else { fb.textContent = i === q.answer ? 'Correcto.' : 'No es la respuesta esperada; revise la explicación.'; reveal.hidden = false; }
      check.disabled = true;
    });
    show.addEventListener('click', () => { reveal.hidden = false; });
    right.append(el('div.qcard', el('b', (q.kind === 'predict' ? 'Predicción · ' : 'Pregunta · ') + q.title), el('p', q.text), opts, el('div.btn-row', check, show, q.scenario ? el('button.btn.small', { type: 'button', onclick: () => { exp.loadScenario(q.scenario); exp.showTab('lab'); } }, 'Ir al escenario') : null), fb, reveal));
  }
  // conclusión basada en datos
  const concl = el('div.reveal', { hidden: true });
  right.append(el('div.qcard', el('b', 'Conclusión basada en esta ejecución'),
    el('p.small.muted', 'Se redacta solo con valores calculados en la sesión actual. Si no hay datos suficientes, se indica.'),
    el('div.btn-row', el('button.btn.small', { type: 'button', onclick: () => { concl.hidden = false; concl.innerHTML = g.conclude(); } }, 'Generar conclusión')), concl));
  // desafíos
  if (g.challenges) for (const c of g.challenges) {
    const out = el('div.small');
    right.append(el('div.qcard', el('b', 'Desafío · ' + c.title), el('p', c.text),
      el('textarea', { rows: 2, placeholder: 'Justifique su resultado aquí (queda solo en esta página)…', 'aria-label': 'Justificación del desafío' }),
      el('div.btn-row', el('button.btn.small', { type: 'button', onclick: () => { const r = c.check(); out.textContent = r.text; out.style.color = r.ok ? 'var(--good)' : 'var(--warn)'; exp.log.add('desafío', c.title + ': ' + r.text); } }, 'Comprobar con los datos actuales')), out));
  }
  return el('div.guide', left, right);
};

/* -------------------- estructura común de un laboratorio -------------------- */
/**
 * Crea la carcasa de un laboratorio con pestañas: Laboratorio, Gráficas, Guía, Pruebas, Registro.
 * exp: {id, key, title, lede} — devuelve referencias a sus zonas.

LAB.buildLabShell = function (exp) {
  const root = el('section.lab', { id: 'lab-' + exp.id, hidden: true, 'aria-label': exp.title });
  const chips = el('div.chips');

  const tabBar = el('div.tabs', { role: 'tablist' });
  const panels = {};
  for (const t of tabs) {
    const [k, name] = t.split(':');
    const b = el('button', { type: 'button', role: 'tab', 'aria-selected': k === 'lab' ? 'true' : 'false', 'data-tab': k }, name);
    b.addEventListener('click', () => exp.showTab(k));
    tabBar.append(b);
    panels[k] = el('div', { role: 'tabpanel', 'data-tab': k, hidden: k !== 'lab' });
  }
  exp.currentTab = 'lab';
  exp.showTab = k => {
    tabBar.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === k ? 'true' : 'false'));
    for (const [pk, p] of Object.entries(panels)) p.hidden = pk !== k;
    exp.currentTab = k;
    exp.onTab && exp.onTab(k);
  };
  root.append(el('div.lab-head', el('div.lab-title', el('span.k', exp.key), el('h2', exp.title)), el('p.lab-lede', exp.lede), chips, tabBar), ...Object.values(panels));

  };
  exp.log = new EventLog();

    el('p.small.muted', 'Registro de esta sesión: escenarios cargados, cambios de parámetros relevantes, cambios de integrador, avisos y pruebas. Se incluye en las exportaciones JSON y en los informes.'),
    el('div.btn-row', el('button.btn.small', { type: 'button', onclick: () => LAB.io.exportText(`registro_${exp.id}.json`, JSON.stringify(exp.log.items, null, 2), 'application/json', 'Exportar registro') }, 'Exportar registro')), logBox));
  document.getElementById('labs').append(root);

/** Bloque estándar de escenario + guardar/cargar en la columna de controles. */

  };
  refreshSaved();
  const nameIn = el('input', { type: 'text', placeholder: 'Nombre', 'aria-label': 'Nombre de la configuración', style: 'width:100%' });

  const load = () => { const saves = LAB.store.get('saves.' + exp.id, {}); const c = saves[savedSel.value]; if (!c) return; exp.deserialize(c); exp.log.add('cargar', 'Configuración cargada: ' + savedSel.value); LAB.toast('Cargada: ' + savedSel.value); };
  const del = () => { const saves = LAB.store.get('saves.' + exp.id, {}); if (!saves[savedSel.value]) return; delete saves[savedSel.value]; LAB.store.set('saves.' + exp.id, saves); refreshSaved(); };
  showDesc();

/** Bucle de animación compartido: cada experimento visible recibe tick(dtReal). */
LAB.loop = (function () {
  let last = performance.now();
  const frame = now => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const cur = LAB.current && LAB.experiments[LAB.current];
    if (cur && cur.tick) { try { cur.tick(dt); } catch (e) { console.error(e); cur.onError && cur.onError(e); } }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  return {};
})();
})();

/* ==== binary.js ==== */
'use strict';
/* =====================================================================
   EXPERIMENTO 1 · ESTRELLAS BINARIAS
   Modelo: dos masas puntuales con gravitación newtoniana, en el plano.
   Unidades internas: UA, años, masas solares → G = 4π² UA³ M☉⁻¹ año⁻²
   (aproximación habitual de la tercera ley de Kepler con el año sidéreo).
   Integrador: leapfrog KDK (velocidad-Verlet) de paso fijo, simpléctico,
   reversible y de segundo orden.
   ===================================================================== */
(function () {
const { el, U } = LAB;
const M = LAB.binaryModel = {};
M.G = 4 * Math.PI * Math.PI;
M.KMS_PER_AUYR = 4.740470463533348; // 1 UA/año en km/s

/** Condiciones iniciales a partir de los parámetros de la interfaz. Centro de masa inicial en el origen. */
M.initState = function (p) {
  const m1 = p.m1, m2 = p.m2, Mt = m1 + m2;
  const r0 = p.r0;
  const vr = p.vrel / M.KMS_PER_AUYR;          // km/s → UA/año
  const phi = p.angle * U.deg;                 // 0° = perpendicular a la línea que une las estrellas
  const vx = vr * Math.sin(phi), vy = vr * Math.cos(phi); // velocidad relativa v2 − v1
  const Vc = (p.vcm || 0) / M.KMS_PER_AUYR, ca = (p.vcmAngle || 0) * U.deg;
  const Vx = Vc * Math.cos(ca), Vy = Vc * Math.sin(ca);
  return {
    m1, m2, t: 0, steps: 0,
    x1: -m2 / Mt * r0, y1: 0, x2: m1 / Mt * r0, y2: 0,
    vx1: Vx - m2 / Mt * vx, vy1: Vy - m2 / Mt * vy,
    vx2: Vx + m1 / Mt * vx, vy2: Vy + m1 / Mt * vy,
    R0x: 0, R0y: 0, Vx, Vy
  };
};
/** Velocidad relativa de órbita circular para una separación r: v = √(G M / r). En km/s. */
M.vCircKms = (m1, m2, r) => Math.sqrt(M.G * (m1 + m2) / r) * M.KMS_PER_AUYR;

M.accel = function (s) {
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
  const r2 = dx * dx + dy * dy, r = Math.sqrt(r2), inv3 = 1 / (r2 * r);
  // Fuerza sobre 1 hacia 2: F = G m1 m2 d / r³  (a1 = G m2 d / r³ ; a2 = −G m1 d / r³)
  return { ax1: M.G * s.m2 * dx * inv3, ay1: M.G * s.m2 * dy * inv3, ax2: -M.G * s.m1 * dx * inv3, ay2: -M.G * s.m1 * dy * inv3, r };
};
/** Un paso leapfrog KDK de tamaño fijo dt. */
M.step = function (s, dt) {
  let a = s._a || M.accel(s);
  const h = dt / 2;
  s.vx1 += a.ax1 * h; s.vy1 += a.ay1 * h; s.vx2 += a.ax2 * h; s.vy2 += a.ay2 * h;
  s.x1 += s.vx1 * dt; s.y1 += s.vy1 * dt; s.x2 += s.vx2 * dt; s.y2 += s.vy2 * dt;
  a = M.accel(s);
  s.vx1 += a.ax1 * h; s.vy1 += a.ay1 * h; s.vx2 += a.ax2 * h; s.vy2 += a.ay2 * h;
  s._a = a; s.t += dt; s.steps++;
};
/** Energías, momento angular (eje z, respecto del origen) y centro de masa. Unidades: M☉·UA²/año². */
M.diag = function (s) {
  const Mt = s.m1 + s.m2;
  const K = 0.5 * s.m1 * (s.vx1 ** 2 + s.vy1 ** 2) + 0.5 * s.m2 * (s.vx2 ** 2 + s.vy2 ** 2);
  const dx = s.x2 - s.x1, dy = s.y2 - s.y1, r = Math.hypot(dx, dy);
  const Upot = -M.G * s.m1 * s.m2 / r;
  const L = s.m1 * (s.x1 * s.vy1 - s.y1 * s.vx1) + s.m2 * (s.x2 * s.vy2 - s.y2 * s.vx2);
  const Rx = (s.m1 * s.x1 + s.m2 * s.x2) / Mt, Ry = (s.m1 * s.y1 + s.m2 * s.y2) / Mt;
  const Vx = (s.m1 * s.vx1 + s.m2 * s.vx2) / Mt, Vy = (s.m1 * s.vy1 + s.m2 * s.vy2) / Mt;
  // energía interna (respecto del CM) — la que determina si el par está ligado
  const Kint = K - 0.5 * Mt * (Vx * Vx + Vy * Vy);
  const Lint = L - Mt * (Rx * Vy - Ry * Vx);
  return { K, U: Upot, E: K + Upot, Kint, Eint: Kint + Upot, L, Lint, Rx, Ry, Vx, Vy, r, dx, dy, dvx: s.vx2 - s.vx1, dvy: s.vy2 - s.vy1 };
};
/** Elementos orbitales del movimiento relativo (problema de un cuerpo equivalente con μ = G(m1+m2)). */
M.elements = function (m1, m2, rx, ry, vx, vy) {
  const mu = M.G * (m1 + m2);
  const r = Math.hypot(rx, ry), v2 = vx * vx + vy * vy;
  const h = rx * vy - ry * vx;
  const eps = v2 / 2 - mu / r;                 // energía específica
  const rv = rx * vx + ry * vy;
  const ex = ((v2 - mu / r) * rx - rv * vx) / mu, ey = ((v2 - mu / r) * ry - rv * vy) / mu;
  const e = Math.hypot(ex, ey);
  const a = Math.abs(eps) < 1e-300 ? Infinity : -mu / (2 * eps);
  const bound = eps < 0;
  const P = bound ? 2 * Math.PI * Math.sqrt(a * a * a / mu) : Infinity;
  const rp = (h * h / mu) / (1 + e);
  const ra = bound ? a * (1 + e) : Infinity;
  return { mu, r, h, eps, e, ex, ey, a, P, rp, ra, bound, rx, ry, vx, vy };
};
/** Posición relativa analítica (solución de Kepler) a un tiempo t desde el estado inicial. */
M.keplerAt = function (el0, t) {
  const { mu, e, a, h } = el0;
  const sgn = h >= 0 ? 1 : -1;
  // dirección del periastro; para e≈0 se usa la dirección inicial
  let px, py;
  if (e > 1e-10) { px = el0.ex / e; py = el0.ey / e; } else { px = el0.rx / el0.r; py = el0.ry / el0.r; }
  const qx = -sgn * py, qy = sgn * px; // perpendicular en el sentido del movimiento
  const nu0 = Math.atan2(el0.rx * qx + el0.ry * qy, el0.rx * px + el0.ry * py);
  if (Math.abs(e - 1) < 1e-6) return null; // parabólica: no implementada (se informa como «no evaluado»)
  let r, nu;
  if (e < 1) {
    const n = Math.sqrt(mu / (a * a * a));
    if (e <= 1e-10) { nu = nu0 + n * t; r = a; }
    else {
      const E0 = 2 * Math.atan2(Math.sqrt(1 - e) * Math.sin(nu0 / 2), Math.sqrt(1 + e) * Math.cos(nu0 / 2));
      const Mm = E0 - e * Math.sin(E0) + n * t;
      const kk = Math.floor(Mm / (2 * Math.PI)), Mr = Mm - 2 * Math.PI * kk; // anomalía media reducida a [0, 2π)
      let E = e < 0.8 ? Mr : Math.PI;
      for (let k = 0; k < 60; k++) { const d = (E - e * Math.sin(E) - Mr) / (1 - e * Math.cos(E)); E -= d; if (Math.abs(d) < 1e-15) break; }
      E += 2 * Math.PI * kk;
      nu = 2 * Math.atan2(Math.sqrt(1 + e) * Math.sin(E / 2), Math.sqrt(1 - e) * Math.cos(E / 2));
      r = a * (1 - e * Math.cos(E));
    }
  } else {
    const n = Math.sqrt(mu / Math.pow(-a, 3));
    const F0 = 2 * Math.atanh(Math.sqrt((e - 1) / (e + 1)) * Math.tan(nu0 / 2));
    const Mm = e * Math.sinh(F0) - F0 + n * t;
    let F = Math.asinh(Mm / e);
    for (let k = 0; k < 100; k++) { const d = (e * Math.sinh(F) - F - Mm) / (e * Math.cosh(F) - 1); F -= d; if (Math.abs(d) < 1e-14) break; }
    nu = 2 * Math.atan(Math.sqrt((e + 1) / (e - 1)) * Math.tanh(F / 2));
    r = a * (1 - e * Math.cosh(F));
  }
  return { x: r * (Math.cos(nu) * px + Math.sin(nu) * qx), y: r * (Math.cos(nu) * py + Math.sin(nu) * qy), r };
};
/** Paso temporal fijo: fracción del periodo circular a la distancia de periastro. */
M.chooseDt = function (p) {
  const s = M.initState(p), d = M.diag(s);
  const el0 = M.elements(p.m1, p.m2, d.dx, d.dy, d.dvx, d.dvy);
  const rref = Math.max(1e-6, Math.min(el0.rp, el0.r));
  return 2 * Math.PI * Math.sqrt(rref ** 3 / el0.mu) / p.stepsPerPeri;
};
/** Simulación sin interfaz (usada por las pruebas). */
M.simulate = function (p, tEnd, dt, every, cb) {
  const s = M.initState(p);
  const n = Math.round(tEnd / dt);
  for (let i = 0; i < n; i++) { M.step(s, dt); if (cb && (i + 1) % every === 0) cb(s); }
  return s;
};

  addW('cmW', 'Centro de masa', { xLabel: 't [años]', yLabel: 'posición [UA]' }, 'Debe ser una recta (o constante si V_CM = 0).');
  exp.rangeIn = el('input', { type: 'number', min: 0, step: 'any', placeholder: 'todo', 'aria-label': 'Mostrar últimos años' });
  exp.rangeIn.addEventListener('change', () => exp.drawCharts(true));
  z.panels.charts.append(el('div.panel.toolbar', el('label', 'Mostrar los últimos ', exp.rangeIn, ' años (vacío = todo)'),
    el('button.btn.small', { type: 'button', onclick: () => exp.exportCSV() }, 'Exportar series CSV'),
    el('button.btn.small', { type: 'button', onclick: () => exp.report() }, 'Informe imprimible')), wide);
  z.panels.guide.append(LAB.guidePanel(exp, guide));
  z.panels.tests.append(LAB.testPanel('binary', 'Las pruebas integran órbitas con el mismo integrador que la animación y las comparan con soluciones analíticas.'));
  LAB.renderChips(exp, z.chips);
  // interacción: rueda = zoom
  exp.canvas.addEventListener('wheel', e => { e.preventDefault(); const v = exp.panel.values.view * (e.deltaY > 0 ? 1.12 : 1 / 1.12); exp.panel.setValues({ view: v }); exp.draw(); }, { passive: false });
  const saved = LAB.store.get('last.binary');
