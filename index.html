/* ------------------------------ laboratorio de métodos ------------------------------ */
exp.runMethods = async function () {
  if (exp._methRunning) return; exp._methRunning = true;
  const p = Object.assign({}, exp.panel.values);
  const Nm = Math.min(p.N, 150);
  const cfg = Object.assign({}, p, { N: Nm, tideOn: false, eps: p.eps });
  const ic = NB.makeIC(Object.assign({}, cfg, { tide: { on: false } }));
  const sc = NB.scales(ic, cfg.eps, null), tcr = sc.tcr;
  const confs = [
    { label: 'referencia DP tol ' + U.fmt(p.rtol / 100, 1), s: { integrator: 'dp45', rtol: p.rtol / 100, force: 'direct' }, ref: true },
    { label: 'DP tol ' + U.fmt(p.rtol, 1), s: { integrator: 'dp45', rtol: p.rtol, force: 'direct' }, color: 'c1' },
    { label: 'leapfrog dt = ' + U.fmt(p.dtFrac, 2) + ' t_cr', s: { integrator: 'leapfrog', dt: p.dtFrac * tcr, force: 'direct' }, color: 'c2' },
    { label: 'leapfrog dt/2', s: { integrator: 'leapfrog', dt: p.dtFrac * tcr / 2, force: 'direct' }, color: 'c3', dash: [6, 3] },
    { label: 'leapfrog + BH θ = ' + p.theta, s: { integrator: 'leapfrog', dt: p.dtFrac * tcr, force: 'bh', theta: p.theta }, color: 'c5', dash: [2, 3] }
  ];
  const nS = 20, results = [];
  exp.methStatus.textContent = `Ejecutando con N = ${Nm}${Nm < p.N ? ' (limitado a 150 para la comparación)' : ''}…`;
  try {
    for (const c of confs) {
      const sim = new NB.Sim(ic, Object.assign({ tcr, eps: cfg.eps, theta: p.theta, tide: { on: false, T: new Float64Array(9) }, hMinFactor: 1e-12 }, c.s));
      const d0 = sim.diag(); const E0 = d0.E, Eref = Math.abs(E0) >= 0.1 * (d0.K + Math.abs(d0.U)) ? Math.abs(E0) : d0.K + Math.abs(d0.U);
      const ts = [0], dE = [0], xs = [Float64Array.from(sim.x)], rr = [d0.rrms];
      let failed = null;
      for (let k = 1; k <= nS; k++) {
        try { sim.advanceTo(k * tcr / nS, Infinity); } catch (e) { failed = e.message; break; }
        const d = sim.diag(); ts.push(sim.t / tcr); dE.push(Math.abs((d.E - E0) / Eref)); xs.push(Float64Array.from(sim.x)); rr.push(d.rrms);
        await U.sleep0();
      }
      results.push(Object.assign({}, c, { ts, dE, xs, rr, failed, steps: sim.nSteps, forces: sim.nForce }));
      exp.methStatus.textContent = `Completado: ${c.label}`;
    }
    const ref = results[0];
    for (const r of results) {
      r.div = r.ts.map((t, k) => { if (!ref.xs[k] || !r.xs[k]) return NaN; const ds = []; for (let i = 0; i < Nm; i++) ds.push(Math.hypot(r.xs[k][3 * i] - ref.xs[k][3 * i], r.xs[k][3 * i + 1] - ref.xs[k][3 * i + 1], r.xs[k][3 * i + 2] - ref.xs[k][3 * i + 2])); return U.median(ds) / ref.rr[k]; });
    }
    exp.mE.set(results.map(r => ({ label: r.label + (r.failed ? ' (detenido)' : ''), x: r.ts, y: r.dE, color: r.color || 'ink', dash: r.dash || [] })));
    exp.mD.set(results.filter(r => !r.ref).map(r => ({ label: r.label, x: r.ts, y: r.div, color: r.color, dash: r.dash || [] })));
    // precisión de Barnes–Hut sobre las posiciones actuales de A
    const A = exp.A, N = A.sim.N, aD = new Float64Array(3 * N), aB = new Float64Array(3 * N), bh = new NB.BH(N), e2 = A.sim.s.eps ** 2;
    NB.accDirect(N, A.sim.m, A.sim.x, aD, e2, null);
    const ths = [0.1, 0.2, 0.3, 0.5, 0.7, 0.9, 1.1], med = [], p99 = [];
    let a2 = 0; for (let i = 0; i < N; i++) a2 += aD[3 * i] ** 2 + aD[3 * i + 1] ** 2 + aD[3 * i + 2] ** 2; const aRms = Math.sqrt(a2 / N); // normalización estándar: evita dividir por fuerzas casi nulas
    for (const th of ths) { bh.acc(N, A.sim.m, A.sim.x, aB, th, e2); const er = []; for (let i = 0; i < N; i++) er.push(Math.hypot(aB[3 * i] - aD[3 * i], aB[3 * i + 1] - aD[3 * i + 1], aB[3 * i + 2] - aD[3 * i + 2]) / aRms); med.push(U.median(er)); p99.push(U.quantile(er, 0.99)); await U.sleep0(); }
    exp.mB.set([{ label: 'mediana', x: ths, y: med, color: 'c1', points: true }, { label: 'percentil 99', x: ths, y: p99, color: 'c2', dash: [5, 3], points: true }]);
    exp.methResults = { N: Nm, tcr, results: results.map(r => ({ label: r.label, finalDE: r.dE[r.dE.length - 1], finalDiv: r.div ? r.div[r.div.length - 1] : null, steps: r.steps, forces: r.forces, failed: r.failed })), bh: { theta: ths, median: med, p99 } };
    exp.methStatus.textContent = `Terminado (${U.nowStamp()}), N = ${Nm}, 1 t_cr.`;
    exp.log.add('métodos', 'Comparación de métodos ejecutada: ' + exp.methResults.results.map(r => `${r.label}: |ΔE| = ${U.fmt(r.finalDE, 2)}`).join('; '));
  } catch (e) { exp.methStatus.textContent = 'Error: ' + e.message; console.error(e); }
  exp._methRunning = false;
};

'use strict';
/* =====================================================================
   VALIDACIÓN DEL EXPERIMENTO 4 (por niveles)
   Física básica · Campo de marea · Métodos avanzados · Exportación y reproducibilidad
   Cada prueba usa el mismo código que el laboratorio (nbody.js / virial.js).
   ===================================================================== */
(function () {
const NB = LAB.nbody, T = LAB.Tests, U = LAB.U;
const L1 = 'Física básica', L2 = 'Campo de marea', L3 = 'Métodos avanzados', L4 = 'Exportación y reproducibilidad';
const plummer = (N, extra) => Object.assign({ N, dist: 'plummer', R: 1, rCut: 10, massMode: 'equal', Mtot: 1000, seedPos: 11, seedVel: 12, velMode: 'plummerDF', Qtarget: 1, eps: 0 }, extra || {});
/** Sistema de dos cuerpos en el plano xy con separación r y fracción f de la velocidad circular. */
function twoBody(r, f, m1 = 500, m2 = 500) {
  const M = m1 + m2, v = f * Math.sqrt(NB.G * M / r);
  const x = new Float64Array([-m2 / M * r, 0, 0, m1 / M * r, 0, 0]);
  const vv = new Float64Array([0, -m2 / M * v, 0, 0, m1 / M * v, 0]);
  return { N: 2, m: new Float64Array([m1, m2]), x, v: vv, M };
}
const relState = s => [s.x[3] - s.x[0], s.x[4] - s.x[1], s.v[3] - s.v[0], s.v[4] - s.v[1]];

/* ---------------- Física básica ---------------- */
T.register('virial', L1, 'two', 'Caso de referencia: órbita circular de dos cuerpos con el motor N-cuerpos', () => {
  const r = 1, sys = twoBody(r, 1), P = 2 * Math.PI * Math.sqrt(r ** 3 / (NB.G * sys.M));
  const out = [];
  let ok = true;
  for (const [name, s, tol] of [['adaptativo', { integrator: 'dp45', rtol: 1e-11, tcr: P }, 1e-7], ['leapfrog', { integrator: 'leapfrog', dt: P / 4000, tcr: P }, 1e-4]]) {
    const sim = new NB.Sim(sys, s); sim.advanceTo(P, Infinity);
    const q = relState(sim), err = Math.hypot(q[0] - r, q[1]) / r;
    out.push(`${name}: |Δr|/r tras un periodo P = ${P.toFixed(4)} Myr: ${err.toExponential(2)}`); if (!(err < tol)) ok = false;
  }
  return LAB.res(ok, out.join('; ') + '.');
}, 'adaptativo < 10⁻⁷; leapfrog (P/4000) < 10⁻⁴');
T.register('virial', L1, 'qic', 'Ajuste de velocidades al Q objetivo', () => {
  const out = []; let ok = true;
  for (const Q of [0.1, 1, 1.6]) { const sys = NB.makeIC(plummer(64, { velMode: 'targetQ', Qtarget: Q, dist: 'uniform', R: 2 })); const e = NB.energies(sys, 0, null); const q = 2 * e.K / Math.abs(e.U); out.push(`objetivo ${Q} → ${q.toFixed(12)}`); if (Math.abs(q - Q) > 1e-10) ok = false; }
  return LAB.res(ok, out.join('; ') + ' (se muestra siempre el Q realmente obtenido).');
}, '|Q − Q_obj| < 10⁻¹⁰');
let consCache = null;
function consRun() {
  if (consCache) return consCache;
  const sys = NB.makeIC(plummer(32)); const sc = NB.scales(sys, 0, null);
  const sim = new NB.Sim(sys, { integrator: 'dp45', rtol: 1e-9, tcr: sc.tcr });
  const d0 = sim.diag(); let mE = 0, mP = 0, mC = 0, mL = 0;
  const Lscale = (() => { let s = 0; for (let i = 0; i < sys.N; i++) s += sys.m[i] * Math.hypot(sys.x[3 * i], sys.x[3 * i + 1], sys.x[3 * i + 2]) * Math.hypot(sys.v[3 * i], sys.v[3 * i + 1], sys.v[3 * i + 2]); return s; })();
  const Pscale = (() => { let s = 0; for (let i = 0; i < sys.N; i++) s += sys.m[i] * Math.hypot(sys.v[3 * i], sys.v[3 * i + 1], sys.v[3 * i + 2]); return s; })();

'use strict';

   · Lente delgada: toda la deflexión ocurre en el plano de la lente.

   · Efecto acromático: la deflexión no depende de la longitud de onda.
   · Se conserva el brillo superficial (trazado inverso de rayos).
   Unidades internas: todos los ángulos en unidades del radio de
   Einstein θ_E; θ_E en radianes para convertir a ″ y a distancias.
   Ecuación de la lente (reducida):  β = θ − α(θ)
   Jacobiano A = ∂β/∂θ ; aumento μ = 1/det A (signo = paridad).
   Modelos: 'point' (masa puntual), 'sis' (esfera isoterma singular),
   'binary' (dos masas puntuales, razón q, separación d en θ_E de la
   masa total) + cizalla externa opcional γ (ángulo φ_γ).

(function () {
const U = LAB.U;
const LM = LAB.lensModel = {};

LM.C = 299792458;               // m/s
LM.KPC = 3.0856775814913673e19; // m
LM.AU = 1.495978707e11;         // m
LM.RSUN = 6.957e8;              // m (radio solar nominal IAU)

})();

/* ==== lens.js ==== */
'use strict';
/* =====================================================================
   EXPERIMENTO 5 · LENTES GRAVITACIONALES — INTERFAZ Y VISTAS
   Vistas sincronizadas del mismo sistema:
     1. Cielo del observador (plano imagen, trazado inverso de rayos)
     2. Plano de la fuente (posición verdadera, cáusticas, trayectoria)
     3. Corte lateral (observador → lente → fuente, ángulos exagerados)
     4. Vista 3D giratoria (planos de lente y fuente, rayos de cada imagen)
     5. Telescopio (el cielo convolucionado con la resolución del instrumento)
   Más curva de luz (microlente), gráficas, guía didáctica y pruebas.
   ===================================================================== */
(function () {

/* ------------------------------ formato de ángulos y distancias ------------------------------ */
function fmtAng(rad) {
  const as = Math.abs(rad) * ARC;
  if (as >= 60) return U.fmt(rad * ARC / 60, 4) + '′';
  if (as >= 0.1) return U.fmt(rad * ARC, 4) + '″';
  if (as >= 1e-4) return U.fmt(rad * ARC * 1e3, 4) + ' mas';
  return U.fmt(rad * ARC * 1e6, 4) + ' µas';
}
function fmtDist(m) {
  const a = Math.abs(m);
  if (a < 0.01 * LM.AU) return U.fmt(m / 1000, 4) + ' km';
  if (a < 2e4 * LM.AU) return U.fmt(m / LM.AU, 4) + ' UA';
  if (a < LM.KPC) return U.fmt(m / (LM.KPC / 1000), 4) + ' pc';
  if (a < 1e3 * LM.KPC) return U.fmt(m / LM.KPC, 4) + ' kpc';
  if (a < 1e6 * LM.KPC) return U.fmt(m / (1e3 * LM.KPC), 4) + ' Mpc';
  return U.fmt(m / (1e6 * LM.KPC), 4) + ' Gpc';
}
LAB.experiments = LAB.experiments || {};
function fmtTime(s) {
  const a = Math.abs(s);
  if (a < 1e-3) return U.fmt(s * 1e6, 4) + ' µs';
  if (a < 1) return U.fmt(s * 1e3, 4) + ' ms';
  if (a < 3600) return U.fmt(s, 4) + ' s';
  if (a < 2 * LM.DAY) return U.fmt(s / 3600, 4) + ' h';
  if (a < 730 * LM.DAY) return U.fmt(s / LM.DAY, 4) + ' días';
  return U.fmt(s / (365.25 * LM.DAY), 4) + ' años';
}

/* ------------------------------ estado derivado ------------------------------ */
exp.compute = function () {
  const p = exp.p = Object.assign({}, exp.panel.values);
  const sc = exp.sc = LM.scales(p);
  exp.valid = sc.valid;
  if (!sc.valid) return;
  exp.L = LM.make(p);
  // posición de la fuente (θ_E): animación > manual
  const thAs = sc.th * ARC;
  let bx, by;
  if (exp.anim && exp.anim.active) [bx, by] = LM.traj(p.u0, p.phi, exp.anim.tau);
  else if (p.posUnit === 'as') { bx = p.bxA / thAs; by = p.byA / thAs; }
  else { bx = p.bx; by = p.by; }
  exp.beta = [bx, by];
  exp.res = LM.images(exp.L, bx, by);
  const thR = p.lensR * LM.RSUN / sc.DL / sc.th; // radio opaco en θ_E
  exp.thR = thR;
  for (const im of exp.res.images) {
    im.r = Math.hypot(im.x, im.y);
    im.hidden = thR > 0 && im.r < thR;
    im.tau = LM.fermat(exp.L, im.x, im.y, bx, by);
  }
  if (exp.res.images.length) { const tmin = Math.min(...exp.res.images.map(i => i.tau)); exp.res.images.forEach(i => { i.dt = (i.tau - tmin) * sc.T0; }); }
  exp.muPoint = LM.totalMu({ ring: exp.res.ring, images: exp.res.images.filter(i => !i.hidden) });
  const vis = exp.res.images.filter(i => !i.hidden); let sep = 0; for (const a of vis) for (const c of vis) sep = Math.max(sep, Math.hypot(a.x - c.x, a.y - c.y));
  if (exp.res.ring) sep = 2;
  exp.sep = sep; exp.sepRad = sep * sc.th;
  exp.tE = sc.RE / (p.vperp * 1000);
};
exp.critKey = '';

/** Galaxias de fondo: objetos pequeños pseudoaleatorios fijos en el plano de la fuente (θ_E). */
function hash2(i, j, k) { let x = (i * 374761393 + j * 668265263 + k * 2147483647) | 0; x = Math.imul(x ^ (x >>> 13), 1274126177); x ^= x >>> 16; return (x >>> 0) / 4294967296; }
function bgGalaxy(bx, by, o) {
  const cell = 0.42, ci = Math.floor(bx / cell), cj = Math.floor(by / cell);
  if (hash2(ci, cj, 1) > 0.45) return 0;
  const cx = (ci + 0.15 + 0.7 * hash2(ci, cj, 2)) * cell, cy = (cj + 0.15 + 0.7 * hash2(ci, cj, 3)) * cell;
  const a = 0.012 + 0.022 * hash2(ci, cj, 4), q = 0.35 + 0.6 * hash2(ci, cj, 5), ang = Math.PI * hash2(ci, cj, 6);
  const dx = bx - cx, dy = by - cy, u = dx * Math.cos(ang) + dy * Math.sin(ang), v = -dx * Math.sin(ang) + dy * Math.cos(ang);
  const r2 = (u / a) ** 2 + (v / (a * q)) ** 2; if (r2 > 1) return 0;
  const I = (0.35 + 0.45 * hash2(ci, cj, 7)) * (1 - r2);
  o[0] = 0.85 * I; o[1] = 0.9 * I; o[2] = I; return I;
}
exp.getCrit = function () {
  const p = exp.p, key = [p.model, p.q, p.d, p.gamma, p.gammaAng].join('|');
  if (key !== exp.critKey) { const R = Math.max(2.6, (p.model === 'binary' ? p.d : 0) + 1.8, 1 / Math.max(0.05, 1 - p.gamma) + 0.5); exp.crit = LM.critical(exp.L, R, 360); exp.critKey = key; }
  return exp.crit;
};
exp.getSource = function () {
  const p = exp.p;
  const type = p.srcType === 'upload' && !exp.uploadTex ? 'letter' : p.srcType;
  const tex = type === 'letter' ? (exp.letterTex || (exp.letterTex = LM.letterTexture())) : type === 'upload' ? exp.uploadTex : null;
  const rs = type === 'point' ? 0.012 : p.rs;
  const key = type + '|' + rs + '|' + (tex ? tex.w : 0) + '|' + (type === 'upload' ? exp.uploadStamp : '');
  if (key !== exp.srcKey) { exp.src = { type, rs, tex }; exp.sample = LM.sourceSampler(exp.src); exp.srcKey = key; exp.srcFluxCache = {}; }

};

  const root = document.documentElement;
  if (t === 'system') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', t);
  const b = document.getElementById('themeBtn'); if (b) b.textContent = 'Tema: ' + TNAME[t];
  LAB.invalidateTheme(); LAB.redrawAll();
}
LAB.redrawAll = function () {
  LAB.invalidateTheme();
  drawCards();
  const cur = LAB.current && LAB.experiments[LAB.current];
  if (cur && cur.redraw) cur.redraw();
};

/* ---------------------- navegación ---------------------- */
LAB.show = function (id) {
  document.getElementById('home').hidden = !!id;
  for (const [k] of ORDER) { const s = document.getElementById('lab-' + k); if (s) s.hidden = k !== id; }
  document.querySelectorAll('#labNav button').forEach(b => b.setAttribute('aria-current', b.dataset.id === id ? 'page' : 'false'));
  LAB.current = id || null;
  const pair = ORDER.find(o => o[0] === id);
  try { history.replaceState(null, '', pair ? '#' + pair[1] : '#inicio'); } catch (e) { /* vistas sin historial */ }
  window.scrollTo(0, 0);
  if (id) { const e = LAB.experiments[id]; setTimeout(() => e.redraw && e.redraw(), 0); }
  else setTimeout(drawCards, 0);
};

/* ---------------------- ilustraciones de las tarjetas ---------------------- */
const cardCanvases = {};
function drawCards() {
  const T = LAB.theme();
  for (const [k, cv] of Object.entries(cardCanvases)) {
    if (!cv.isConnected || cv.clientWidth === 0) continue;
    const { ctx, w, h } = LAB.fitCanvas(cv);
    ctx.fillStyle = T['scene-bg']; ctx.fillRect(0, 0, w, h);
    ctx.lineWidth = 1.4;
    if (k === 'binary') {
      const cx = w / 2, cy = h / 2;
      ctx.strokeStyle = T['star-a']; ctx.beginPath(); ctx.ellipse(cx - 12, cy, 26, 20, 0, 0, 7); ctx.stroke();
      ctx.strokeStyle = T['star-b']; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.ellipse(cx + 24, cy, 52, 40, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = T['star-a']; ctx.beginPath(); ctx.arc(cx - 38, cy, 8, 0, 7); ctx.fill();
      ctx.fillStyle = T['star-b']; ctx.beginPath(); ctx.arc(cx + 76, cy, 5.5, 0, 7); ctx.fill();
      ctx.strokeStyle = T.ink; ctx.beginPath(); ctx.moveTo(cx - 5, cy); ctx.lineTo(cx + 5, cy); ctx.moveTo(cx, cy - 5); ctx.lineTo(cx, cy + 5); ctx.stroke();
    } else if (k === 'reflector') {
      const x0 = 26, y0 = h / 2, L = w - 70, D = h * 0.62;
      ctx.strokeStyle = T['ink-3']; ctx.strokeRect(x0 - 4, y0 - D / 2 - 6, L + 10, D + 12);
      ctx.strokeStyle = T.mirror; ctx.lineWidth = 3; ctx.beginPath(); for (let i = 0; i <= 30; i++) { const y = -D / 2 + D * i / 30; const x = x0 + y * y / (4 * L * 1.1) * 3; if (i === 0) ctx.moveTo(x, y0 + y); else ctx.lineTo(x, y0 + y); } ctx.stroke();
      const sx = x0 + L * 0.82; ctx.beginPath(); ctx.moveTo(sx - 9, y0 + 9); ctx.lineTo(sx + 9, y0 - 9); ctx.stroke();
      ctx.lineWidth = 1; ctx.strokeStyle = T.ray;
      for (const f of [-0.42, -0.25, 0.25, 0.42]) { const y = y0 + f * D; const xm = x0 + (f * D) ** 2 / (4 * L * 1.1) * 3; ctx.beginPath(); ctx.moveTo(w, y); ctx.lineTo(xm, y); const t = (sx - xm) / (L * 0.95); ctx.lineTo(sx, y + (y0 - y) * Math.min(1, t * 1.1)); ctx.lineTo(sx, y0 - D / 2 - 14); ctx.stroke(); }
    } else if (k === 'refractor') {
      const y0 = h / 2, x1 = 40, x2 = w - 60, f2 = 26;
      ctx.strokeStyle = T['ink-3']; ctx.setLineDash([8, 3, 2, 3]); ctx.beginPath(); ctx.moveTo(0, y0); ctx.lineTo(w, y0); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = T.glass; ctx.strokeStyle = T['ray-2'];
      ctx.beginPath(); ctx.ellipse(x1, y0, 6, h * 0.36, 0, 0, 7); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x2, y0, 4, h * 0.16, 0, 0, 7); ctx.fill(); ctx.stroke();
      const xf = x2 - f2; ctx.strokeStyle = T.ray; ctx.lineWidth = 1;
      for (const y of [-0.3, -0.1, 0.1, 0.3]) { const ya = y0 + y * h; ctx.beginPath(); ctx.moveTo(0, ya - 8); ctx.lineTo(x1, ya); const yi = y0 + 6; ctx.lineTo(x2, ya + (yi - ya) * (x2 - x1) / (xf - x1)); ctx.lineTo(w, ya + (yi - ya) * (x2 - x1) / (xf - x1) - (y * h) * 0.2); ctx.stroke(); }
    } else if (k === 'lens') {
      ctx.fillStyle = '#04060b'; ctx.fillRect(0, 0, w, h);
      const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.3;
      const g = ctx.createRadialGradient(cx, cy, R * 0.85, cx, cy, R * 1.15); g.addColorStop(0, 'rgba(120,170,255,0)'); g.addColorStop(0.5, 'rgba(150,190,255,0.9)'); g.addColorStop(1, 'rgba(120,170,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R * 1.15, 0, 7); ctx.arc(cx, cy, R * 0.85, 0, 7, true); ctx.fill();
      const gl = ctx.createRadialGradient(cx, cy, 0, cx, cy, R * 0.4); gl.addColorStop(0, 'rgba(255,210,140,0.95)'); gl.addColorStop(1, 'rgba(255,210,140,0)');
      ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy, R * 0.4, 0, 7); ctx.fill();
    } else if (k === 'virial') {
      const r = U.rng(7);
      for (let i = 0; i < 260; i++) { const X = Math.max(1e-6, r()); const rr = 22 / Math.sqrt(Math.pow(X, -2 / 3) - 1); const a = 2 * Math.PI * r(), z = 2 * r() - 1; const px = w / 2 + rr * Math.sqrt(1 - z * z) * Math.cos(a) * 1.25, py = h / 2 + rr * Math.sqrt(1 - z * z) * Math.sin(a) * 0.85; ctx.fillStyle = T['star-a']; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(px, py, 1.4, 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1; ctx.strokeStyle = T.data; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.ellipse(w / 2, h / 2, 30, 21, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    }
  }
}

/* ---------------------- verificación global ---------------------- */
LAB.runAllTests = async function (onProgress) {
  await LAB.Tests.run(() => true, onProgress);
  return ORDER.map(([k]) => ({ experimento: k, niveles: LAB.Tests.levels(k).map(l => Object.assign({ nivel: l }, LAB.Tests.summary(k, l))), pruebas: LAB.Tests.dump(k) }));
};

/* ---------------------- arranque ---------------------- */
function buildHome() {
  const home = document.getElementById('home');
  const cards = el('div.cards');
  ORDER.forEach(([k], i) => {
    const e = LAB.experiments[k];
    const cv = el('canvas', { 'aria-hidden': 'true' }); cardCanvases[k] = cv;
    cards.append(el('button.card', { type: 'button', onclick: () => LAB.show(k), 'aria-label': 'Abrir ' + e.title },
      cv, el('div', el('span.k', 'EXPERIMENTO ' + (i + 1)), el('h3', e.title), el('p', CARD[k].text)), el('div.tags', CARD[k].tags.map(t => el('span.tag', t)))));
  });
  const vStatus = el('div.small.muted', 'Las pruebas no se han ejecutado en esta sesión: su estado es «no evaluado».');
  const vBtn = el('button.btn', { type: 'button' }, 'Ejecutar todas las pruebas (≈ 10–30 s)');
  vBtn.addEventListener('click', async () => {
    vBtn.disabled = true; let n = 0; const total = LAB.Tests.list.length;
    const res = await LAB.runAllTests(t => { n++; vStatus.textContent = `Ejecutando ${n}/${total}: ${t.name}`; });
    const c = { pass: 0, review: 0, fail: 0, none: 0 }; for (const r of res) for (const t of r.pruebas) { const k = Object.keys(LAB.STATUS).find(s => LAB.STATUS[s] === t.estado); c[k]++; }
    vStatus.textContent = `Terminado: ${c.pass} validadas, ${c.review} requieren revisión, ${c.fail} fallidas, ${c.none} sin evaluar. Detalles en la pestaña «Pruebas» de cada laboratorio.`;
    vBtn.disabled = false;
  });
  home.append(
    el('div.home-intro', el('span.eyebrow', 'Óptica y gravitación · simulaciones con física explícita'), el('h1', 'Laboratorio Astrofísico'),
      el('p.muted', 'Cinco laboratorios para cambiar parámetros físicos, observar la evolución de un fenómeno, consultar resultados calculados y comprobar los límites de cada modelo. Funciona sin conexión y sin instalación.')),
    cards,
    el('div.home-notes',
      el('div', el('b', 'Entradas, resultados, modelo y validación'), 'Cada laboratorio separa los datos de entrada, las magnitudes calculadas, las aproximaciones del modelo y los diagnósticos.'),
      el('div', el('b', 'Predecir antes de mirar'), 'La pestaña «Guía didáctica» pide una predicción antes de mostrar la explicación y redacta conclusiones con los datos de su ejecución.'),
      el('div', el('b', 'Pruebas reales'), 'Ninguna prueba aparece como superada sin ejecutarse. ', vStatus, el('div', { style: 'margin-top:6px' }, vBtn))));
}
function buildNav() {
  const nav = document.getElementById('labNav');
  const SHORT = { binary: 'Binarias', reflector: 'Reflector', refractor: 'Refractor', virial: 'Virial', lens: 'Lentes' };
  ORDER.forEach(([k], i) => { const e = LAB.experiments[k]; nav.append(el('button', { type: 'button', 'data-id': k, title: e.title, onclick: () => LAB.show(k) }, el('span.k', 'E' + (i + 1)), SHORT[k])); });
  document.getElementById('homeBtn').addEventListener('click', () => LAB.show(null));
  const tb = document.getElementById('themeBtn');
  let th = LAB.store.get('theme', 'system'); if (!THEMES.includes(th)) th = 'system';
  tb.addEventListener('click', () => { th = THEMES[(THEMES.indexOf(th) + 1) % 3]; LAB.store.set('theme', th); applyTheme(th); });
  applyTheme(th);
}
function boot() {
  for (const [k] of ORDER) {
    try { LAB.experiments[k].init(); }
    catch (e) { console.error(e); const s = document.getElementById('labs'); s.append(el('div.alert-bar.bad', 'No se pudo iniciar el experimento «' + k + '»: ' + e.message)); }
  }
  buildHome(); buildNav();
  let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(LAB.redrawAll, 120); });
  const h = (location.hash || '').slice(1), pair = ORDER.find(o => o[1] === h);
  LAB.show(pair ? pair[0] : null);
  LAB.ready = true;
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
